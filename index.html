<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Azim Core</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
  :root{
    --navy-deep:#10192b; --navy:#16223b; --navy-light:#1f2f4d; --panel:#1a2740; --line:#2c3c5c;
    --brass:#c19a5b; --brass-bright:#e0bd7d; --ivory:#f2ede2; --ivory-dim:#b9c0cf;
    --green:#5fae76; --green-bg:#173425; --red:#d3695f; --red-bg:#3a2018; --amber:#dba24a; --amber-bg:#3a2f14; --radius:10px; --btn-ink:#1b2438;
    --bg-glow-1:#1c2c4d; --bg-glow-2:#24345530;
  }
  :root[data-theme="light"]{
    --navy-deep:#f3efe4; --navy:#ffffff; --navy-light:#ffffff; --panel:#ffffff; --line:#e2ddcf;
    --brass:#a6793a; --brass-bright:#8a6229; --ivory:#20293c; --ivory-dim:#5b6376;
    --green:#2f7d46; --green-bg:#e2f3e6; --red:#c1443b; --red-bg:#fbe5e3; --amber:#9c6a1c; --amber-bg:#faf0dc; --btn-ink:#ffffff;
    --bg-glow-1:#e3dcc6; --bg-glow-2:#d8ceb355;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(1200px 600px at 15% -10%, var(--bg-glow-1) 0%, transparent 55%),
      radial-gradient(1000px 500px at 110% 10%, var(--bg-glow-2) 0%, transparent 50%), var(--navy-deep);
    color:var(--ivory); font-family:'Inter',sans-serif; min-height:100vh;
  }
  h1,h2,h3,.display{font-family:'Fraunces',serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  ::selection{background:var(--brass);color:var(--btn-ink);}
  #login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .login-card{width:100%;max-width:420px;background:linear-gradient(180deg,var(--navy-light),var(--panel));border:1px solid var(--line);border-radius:16px;padding:40px 36px;box-shadow:0 30px 60px -20px rgba(0,0,0,.6);position:relative;overflow:hidden;}
  .login-card::before{content:"";position:absolute;top:-40%;left:-20%;width:180%;height:180%;background:radial-gradient(circle at 30% 20%, rgba(193,154,91,.10), transparent 55%);pointer-events:none;}
  .vault-mark{width:52px;height:52px;border-radius:50%;border:2px solid var(--brass);display:flex;align-items:center;justify-content:center;margin-bottom:22px;position:relative;}
  .vault-mark::after{content:"";width:20px;height:20px;border-radius:50%;border:2px solid var(--brass-bright);}
  .login-card h1{font-size:26px;color:var(--ivory);margin:0 0 4px;font-weight:600;letter-spacing:.01em;}
  .login-sub{color:var(--ivory-dim);font-size:13.5px;margin:0 0 28px;letter-spacing:.02em;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--brass);margin-bottom:7px;}
  select,input[type=password],input[type=text],input[type=number]{width:100%;background:var(--navy-deep);border:1px solid var(--line);color:var(--ivory);padding:11px 13px;border-radius:8px;font-size:14.5px;font-family:'Inter',sans-serif;outline:none;transition:border-color .15s;}
  select:focus,input:focus{border-color:var(--brass);}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--brass);color:var(--btn-ink);border:none;padding:12px 20px;border-radius:8px;font-weight:600;font-size:14.5px;cursor:pointer;transition:transform .1s, background .15s;letter-spacing:.01em;}
  .btn:hover{background:var(--brass-bright);}
  .btn:active{transform:scale(.98);}
  .btn.full{width:100%;margin-top:6px;}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ivory-dim);}
  .btn.ghost:hover{border-color:var(--brass);color:var(--brass-bright);}
  .btn.danger{background:var(--red);color:#2a0f0d;}
  .btn.small{padding:7px 13px;font-size:13px;}
  .login-err{color:var(--red);font-size:13px;margin:-6px 0 14px;}
  .login-hint{margin-top:22px;font-size:11.5px;color:#7c8aa3;line-height:1.6;border-top:1px dashed var(--line);padding-top:16px;}
  #app-screen{display:none;min-height:100vh;}
  .shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh;}
  .sidebar{background:linear-gradient(180deg,#111b30,#0d1526);border-right:1px solid var(--line);padding:26px 18px;display:flex;flex-direction:column;}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:6px;padding:0 6px;}
  .brand .vault-mark{width:30px;height:30px;margin:0;}
  .brand .vault-mark::after{width:11px;height:11px;}
  .brand-text{line-height:1.15;}
  .brand-text b{display:block;font-family:'Fraunces',serif;font-size:16.5px;color:var(--ivory);letter-spacing:.01em;}
  .brand-text span{font-size:10.5px;color:var(--ivory-dim);letter-spacing:.06em;}
  .userbox{margin:20px 0 18px;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;}
  .userbox .name{font-weight:600;font-size:14px;color:var(--ivory);}
  .userbox .role{font-size:11.5px;color:var(--brass);text-transform:uppercase;letter-spacing:.06em;margin-top:2px;}
  .lang-fixed{position:fixed;top:14px;right:16px;display:flex;gap:4px;z-index:500;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:3px;box-shadow:0 6px 18px rgba(0,0,0,.35);}
  .lang-btn{padding:5px 11px;border-radius:16px;background:transparent;border:none;color:var(--ivory-dim);font-size:11px;font-weight:700;cursor:pointer;text-align:center;letter-spacing:.03em;}
  .lang-btn.active{background:var(--brass);color:var(--btn-ink);}
  nav{flex:1;display:flex;flex-direction:column;gap:2px;margin-top:6px;}
  .nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:8px;color:var(--ivory-dim);text-decoration:none;font-size:14px;cursor:pointer;border:1px solid transparent;transition:all .12s;}
  .nav-item:hover{background:var(--navy-light);color:var(--ivory);}
  .nav-item.active{background:var(--navy-light);color:var(--brass-bright);border-color:var(--line);font-weight:600;}
  .nav-icon{width:18px;text-align:center;}
  .day-badge{margin-top:14px;padding:10px 12px;border-radius:8px;font-size:12px;display:flex;align-items:center;justify-content:space-between;gap:6px;}
  .day-badge.open{background:var(--green-bg);color:var(--green);border:1px solid #285c3f;}
  .day-badge.closed{background:var(--red-bg);color:var(--amber);border:1px solid #5a3a24;}
  .sidebar-footer{margin-top:10px;text-align:center;font-size:10.5px;color:#5c6a85;letter-spacing:.04em;}
  .founder-link{margin-top:10px;text-align:center;font-size:11.5px;color:var(--brass);cursor:pointer;letter-spacing:.02em;}
  .founder-link:hover{color:var(--brass-bright);text-decoration:underline;}
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(5,8,16,.72);z-index:2000;align-items:center;justify-content:center;padding:24px;}
  .modal-overlay.show{display:flex;}
  .modal-card{position:relative;max-width:420px;width:100%;background:linear-gradient(180deg,var(--navy-light),var(--panel));border:1px solid var(--line);border-radius:16px;padding:34px 30px 28px;text-align:center;box-shadow:0 30px 70px -20px rgba(0,0,0,.6);max-height:88vh;overflow-y:auto;}
  .modal-close{position:absolute;top:14px;right:14px;font-size:16px;}
  .founder-photo{width:150px;height:150px;object-fit:cover;border-radius:50%;border:3px solid var(--brass);margin-bottom:18px;}
  .modal-card h2{font-size:19px;margin:0 0 4px;color:var(--ivory);}
  .founder-title{font-size:12.5px;color:var(--brass);text-transform:uppercase;letter-spacing:.05em;margin-bottom:16px;}
  .founder-bio{font-size:13.5px;color:var(--ivory-dim);line-height:1.75;text-align:left;white-space:pre-line;}
  .main{padding:30px 38px 60px;overflow-x:hidden;}
  .topline{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:26px;flex-wrap:wrap;gap:14px;}
  .topline h2{font-size:24px;margin:0 0 4px;color:var(--ivory);font-weight:600;}
  .topline .sub{color:var(--ivory-dim);font-size:13.5px;margin:0;}
  .grid{display:grid;gap:16px;}
  .grid.cols-4{grid-template-columns:repeat(4,1fr);}
  .grid.cols-3{grid-template-columns:repeat(3,1fr);}
  .grid.cols-2{grid-template-columns:repeat(2,1fr);}
  @media(max-width:1000px){.grid.cols-4{grid-template-columns:repeat(2,1fr);} .grid.cols-3{grid-template-columns:repeat(2,1fr);}}
  .card{background:linear-gradient(180deg,var(--navy-light),var(--panel));border:1px solid var(--line);border-radius:var(--radius);padding:20px;}
  .stat-card .label{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--brass);margin-bottom:8px;}
  .stat-card .value{font-family:'Fraunces',serif;font-size:26px;color:var(--ivory);font-weight:600;}
  .stat-card .foot{font-size:12px;color:var(--ivory-dim);margin-top:6px;}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin-bottom:20px;}
  .panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
  .panel-head h3{margin:0;font-size:16.5px;color:var(--ivory);font-weight:600;}
  .panel-head .actions{display:flex;gap:8px;flex-wrap:wrap;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;color:var(--brass);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:9px 10px;border-bottom:1px solid var(--line);}
  td{padding:9px 10px;border-bottom:1px solid #223252;color:var(--ivory);}
  tr:last-child td{border-bottom:none;}
  td input[type=number]{width:90px;padding:6px 8px;font-size:13px;}
  .num{font-family:'IBM Plex Mono',monospace;}
  .right{text-align:right;}
  .muted{color:var(--ivory-dim);}
  .tag{display:inline-flex;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:.02em;}
  .tag.pending{background:var(--amber-bg);color:var(--amber);}
  .tag.approved{background:var(--green-bg);color:var(--green);}
  .tag.rejected{background:var(--red-bg);color:var(--red);}
  .tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap;}
  .tab{padding:8px 15px;border-radius:20px;background:var(--panel);border:1px solid var(--line);color:var(--ivory-dim);font-size:13px;cursor:pointer;}
  .tab.active{background:var(--brass);color:var(--btn-ink);font-weight:600;border-color:var(--brass);}
  .form-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
  .form-row .field{flex:1;min-width:160px;margin-bottom:0;}
  .denom-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin:14px 0 18px;}
  .denom-box{background:var(--navy-deep);border:1px solid var(--line);border-radius:8px;padding:9px;}
  .denom-box .d{font-size:11px;color:var(--brass);margin-bottom:5px;font-family:'IBM Plex Mono',monospace;}
  .denom-box input{padding:6px 7px;font-size:13px;}
  .req-total{margin-top:6px;font-size:14px;color:var(--ivory-dim);}
  .req-total b{color:var(--brass-bright);font-family:'IBM Plex Mono',monospace;}
  .empty{padding:36px 10px;text-align:center;color:var(--ivory-dim);font-size:13.5px;}
  .toast{position:fixed;bottom:24px;right:24px;background:var(--brass);color:var(--btn-ink);padding:12px 18px;border-radius:8px;font-size:13.5px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.4);z-index:999;opacity:0;transform:translateY(8px);transition:all .25s;pointer-events:none;max-width:320px;}
  .toast.show{opacity:1;transform:translateY(0);}
  .badge-cash{font-size:11px;padding:2px 8px;border-radius:6px;background:var(--navy-deep);color:var(--brass-bright);margin-left:8px;font-family:'IBM Plex Mono',monospace;}
  .loading{padding:60px;text-align:center;color:var(--ivory-dim);}
  select.small{width:auto;padding:8px 12px;}
  .ledger-table thead.income th{background:var(--green-bg);color:var(--green);}
  .ledger-table thead.expense th{background:var(--red-bg);color:var(--red);}
  .ledger-wrap{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  @media(max-width:1100px){.ledger-wrap{grid-template-columns:1fr;}}
  .amt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin:12px 0;}
  .icon-btn{background:transparent;border:none;color:var(--ivory-dim);cursor:pointer;font-size:15px;padding:4px 6px;border-radius:6px;}
  .icon-btn:hover{background:var(--navy-light);color:var(--red);}
  .pw-row{display:flex;gap:8px;align-items:center;}
  .pw-row input{width:150px;}
</style>
</head>
<body>

<div id="login-screen">
  <div class="lang-fixed"><div class="lang-btn" id="themeToggleLogin" title="Тема">🌙</div><div class="lang-btn" id="langTjLogin">ТОҶ</div><div class="lang-btn" id="langRuLogin">РУС</div></div>
  <div class="login-card">
    <div class="vault-mark"></div>
    <h1>Azim Core</h1>
    <p class="login-sub" id="loginSub">Системаи идоракунии хазинавии «Васл Бонк»</p>
    <div class="field"><label id="lblLoginUser">Корбар</label><select id="loginUser"></select></div>
    <div class="field"><label id="lblLoginPass">Рамз (Password)</label><input type="password" id="loginPass" placeholder="••••••••"></div>
    <div class="login-err" id="loginErr" style="display:none;"></div>
    <button class="btn full" id="loginBtn" onclick="handleLogin()">Вуруд</button>
    <div class="login-hint" id="loginHint">Бор шудан истодааст…</div>
  </div>
</div>

<div id="app-screen">
  <div class="lang-fixed"><div class="lang-btn" id="themeToggle" title="Тема">🌙</div><div class="lang-btn" id="langTj">ТОҶ</div><div class="lang-btn" id="langRu">РУС</div></div>
  <div class="shell">
    <div class="sidebar">
      <div class="brand"><div class="vault-mark"></div><div class="brand-text"><b>Azim Core</b><span id="brandSub">Хазинадорӣ V1</span></div></div>
      <div class="userbox"><div class="name" id="ubName"></div><div class="role" id="ubRole"></div></div>
      <nav id="navList"></nav>
      <div class="day-badge" id="dayBadge"></div>
      <button class="btn ghost full" style="margin-top:14px;" id="logoutBtn" onclick="logout()">Баромад</button>
      <div class="sidebar-footer" id="sidebarFooter">Azim Core · V1.2.0</div>
      <div class="founder-link" id="founderLink">ℹ️ <span id="founderLinkText">Дар бораи муассис</span></div>
    </div>
    <div class="main" id="mainArea"><div class="loading">Бор шудан истодааст…</div></div>
  </div>
</div>

  <div class="modal-card">

let CURRENT_PAGE = 'dashboard';
let selectedKassaView = null;
let reqDraft = null;
let editingReqId = null;
let editReqDraft = null;
let kassaTab = 'denoms';
let ledgerDraft = null;
let editingLedgerId = null;
let editLedgerDraft = null;
let openingEditMode = false;
let editingCbId = null;

/* ================= STORAGE ================= */
const STORAGE_KEY = 'azimcore_state_v1';
const LANG_KEY = 'azimcore_lang';
const THEME_KEY = 'azimcore_theme';
let THEME = 'dark';

function emptyBalancesFor(locs){
  const b = {};
  locs.forEach(loc=>{
    b[loc] = {};
    Object.keys(CURRENCIES).forEach(cur=>{ b[loc][cur] = {}; CURRENCIES[cur].denoms.forEach(d=> b[loc][cur][d]=0); });
  });
  return b;
}
function defaultState(){
  const cashboxes = JSON.parse(JSON.stringify(DEFAULT_CASHBOXES));
  const users = JSON.parse(JSON.stringify(DEFAULT_USERS));
  const locs = ['mahzan', ...Object.keys(cashboxes)];
  const ledger = {};
  Object.keys(cashboxes).forEach(id=> ledger[id] = { opening:{}, entries:[] });
  return { cashboxes, users, balances: emptyBalancesFor(locs), cashLedger: ledger, requests: [], journal: [],
           trCounter: 0, businessDay: { date: todayStr(), closed:false }, createdAt: Date.now() };
}
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

function normalizeState(raw){
  STATE = raw;
  if(!STATE.cashboxes) STATE.cashboxes = JSON.parse(JSON.stringify(DEFAULT_CASHBOXES));
  if(!STATE.users) STATE.users = JSON.parse(JSON.stringify(DEFAULT_USERS));
  if(!STATE.cashLedger) STATE.cashLedger = {};
  const locs = ['mahzan', ...Object.keys(STATE.cashboxes)];
  const fresh = emptyBalancesFor(locs);
  Object.keys(fresh).forEach(loc=>{
    if(!STATE.balances[loc]) STATE.balances[loc] = fresh[loc];
    Object.keys(fresh[loc]).forEach(cur=>{ if(!STATE.balances[loc][cur]) STATE.balances[loc][cur] = fresh[loc][cur]; });
  });
  Object.keys(STATE.cashboxes).forEach(id=>{ if(!STATE.cashLedger[id]) STATE.cashLedger[id] = { opening:{}, entries:[] }; });
}

async function loadState(){
  try{
    const res = await fetch('/api/state');
    const data = await res.json();
    if(data && data.value){ normalizeState(data.value); return; }
  }catch(e){ console.error(e); }
  STATE = defaultState();
  await saveState();
}
async function saveState(){
  try{
    const res = await fetch('/api/state', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(STATE) });
    if(!res.ok) throw new Error('save_failed');
  }catch(e){ console.error(e); showToast('Хатои пайвастшавӣ бо сервер! / Ошибка соединения с сервером!'); }
}
async function loadLang(){
  try{ const l = localStorage.getItem(LANG_KEY); if(l) LANG = l; }catch(e){ /* default tj */ }
}
async function setLang(l){
  LANG = l;
  try{ localStorage.setItem(LANG_KEY, l); }catch(e){}
  applyStaticTranslations();
  if(CURRENT_USER){ buildNav(); render(); }
  else { populateLoginUsers(); }
}

function loadTheme(){
  try{ const s = localStorage.getItem(THEME_KEY); if(s) THEME = s; }catch(e){ /* default dark */ }
  applyTheme();
}
function applyTheme(){
  document.documentElement.setAttribute('data-theme', THEME);
  const icon = THEME==='dark' ? '☀️' : '🌙';
  const b1 = document.getElementById('themeToggle');
  const b2 = document.getElementById('themeToggleLogin');
  if(b1) b1.textContent = icon;
  if(b2) b2.textContent = icon;
}
function toggleTheme(){
  THEME = THEME==='dark' ? 'light' : 'dark';
  try{ localStorage.setItem(THEME_KEY, THEME); }catch(e){}
  applyTheme();
}

// Poll the server every few seconds so changes made on other computers appear here too.
// Skipped while the person is mid-edit locally, so it never overwrites unsaved input.
let pollTimer = null;
function isMidEdit(){
  return mahzanEditMode || kassaEditMode || !!editingReqId || !!editingCbId || openingEditMode || !!ledgerDraft || !!reqDraft;
}
function startPolling(){
  if(pollTimer) return;
  pollTimer = setInterval(async ()=>{
    if(!CURRENT_USER || isMidEdit()) return;
    try{
      const res = await fetch('/api/state');
      const data = await res.json();
      if(data && data.value){ normalizeState(data.value); render(); }
    }catch(e){ /* offline — try again next tick */ }
  }, 8000);
}

function applyStaticTranslations(){
  document.getElementById('loginSub').textContent = t('login_sub');
  document.getElementById('lblLoginUser').textContent = t('login_user');
  document.getElementById('lblLoginPass').textContent = t('login_pass');
  document.getElementById('loginBtn').textContent = t('login_btn');
  document.getElementById('loginHint').textContent = t('login_hint');
  document.getElementById('loginHint').style.display = 'none';
  document.getElementById('brandSub').textContent = t('brand_sub');
  document.getElementById('logoutBtn').textContent = t('logout');
  document.getElementById('sidebarFooter').textContent = 'Azim Core · ' + APP_VERSION;
  document.getElementById('founderLinkText').textContent = t('founder_link');
  document.getElementById('langTj').classList.toggle('active', LANG==='tj');
  document.getElementById('langRu').classList.toggle('active', LANG==='ru');
  document.getElementById('langTjLogin').classList.toggle('active', LANG==='tj');
  document.getElementById('langRuLogin').classList.toggle('active', LANG==='ru');
  if(CURRENT_USER){
    document.getElementById('ubRole').textContent = roleLabel(CURRENT_USER.role);
  }
}

/* ================= AUTH ================= */
function populateLoginUsers(){
  const sel = document.getElementById('loginUser');
  sel.innerHTML = '';
  Object.entries(STATE.users).forEach(([key,u])=>{
    const opt = document.createElement('option');
    opt.value = key; opt.textContent = userDisplayName(key,u) + ' ('+key+')';
    sel.appendChild(opt);
  });
}
function userDisplayName(key,u){ return (DEFAULT_USER_NAMES[key] && DEFAULT_USER_NAMES[key][LANG]) || u.name; }

async function handleLogin(){
  await loadState();
  const key = document.getElementById('loginUser').value;
  const pass = document.getElementById('loginPass').value;
  const u = STATE.users[key];
  const errEl = document.getElementById('loginErr');
  if(!u || u.password !== pass){ errEl.style.display='block'; errEl.textContent = t('login_err'); return; }
  errEl.style.display='none';
  CURRENT_USER = { key, ...u };
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app-screen').style.display='block';
  document.getElementById('ubName').textContent = userDisplayName(key,u);
  document.getElementById('ubRole').textContent = roleLabel(u.role);
  if(u.role==='kassir') selectedKassaView = u.cashbox;
  else selectedKassaView = Object.keys(STATE.cashboxes)[0];
  CURRENT_PAGE = 'dashboard';
  buildNav();
  navigate('dashboard');
  startPolling();
}
function logout(){
  CURRENT_USER = null;
  if(pollTimer){ clearInterval(pollTimer); pollTimer = null; }
  document.getElementById('loginPass').value='';
  document.getElementById('app-screen').style.display='none';
  document.getElementById('login-screen').style.display='flex';
}
function roleLabel(r){ return t('role_'+r) || r; }
function cashboxLabel(id){
  if(DEFAULT_CASHBOX_NAMES[id]) return DEFAULT_CASHBOX_NAMES[id][LANG];
  return STATE.cashboxes[id] ? STATE.cashboxes[id].label : (id + ' (—)');
}

/* ================= NAV ================= */
const MENU = [
  { id:'dashboard', icon:'🏠', key:'nav_dashboard', roles:['admin','mudir','kassir'] },
  { id:'mahzan',    icon:'🏦', key:'nav_mahzan',     roles:['admin','mudir'] },
  { id:'kassa',     icon:'💰', key:'nav_kassa',      roles:['admin','mudir','kassir'] },
  { id:'requests',  icon:'📨', key:'nav_requests',   roles:['admin','mudir','kassir'] },
  { id:'journal',   icon:'📜', key:'nav_journal',    roles:['admin','mudir','kassir'] },
  { id:'reports',   icon:'📊', key:'nav_reports',    roles:['admin','mudir'] },
  { id:'users',     icon:'👥', key:'nav_users',      roles:['admin'] },
  { id:'settings',  icon:'⚙',  key:'nav_settings',   roles:['admin','mudir'] },
];
function buildNav(){
  const nav = document.getElementById('navList');
  nav.innerHTML = '';
  MENU.filter(m=>m.roles.includes(CURRENT_USER.role)).forEach(m=>{
    const a = document.createElement('div');
    a.className = 'nav-item' + (CURRENT_PAGE===m.id?' active':'');
    a.dataset.page = m.id;
    a.innerHTML = `<span class="nav-icon">${m.icon}</span><span>${t(m.key)}</span>`;
    a.onclick = ()=> navigate(m.id);
    nav.appendChild(a);
  });
  renderDayBadge();
  document.getElementById('langTj').onclick = ()=> setLang('tj');
  document.getElementById('langRu').onclick = ()=> setLang('ru');
  document.getElementById('langTj').classList.toggle('active', LANG==='tj');
  document.getElementById('langRu').classList.toggle('active', LANG==='ru');
}
function renderDayBadge(){
  const el = document.getElementById('dayBadge');
  const closed = STATE.businessDay.closed;
  el.className = 'day-badge ' + (closed?'closed':'open');
  el.innerHTML = `<span>${closed?t('day_closed'):t('day_open')}</span><span class="mono">${STATE.businessDay.date}</span>`;
}
function navigate(page){
  if(page !== 'requests'){ editingReqId = null; editReqDraft = null; }
  if(page !== 'kassa'){ ledgerDraft = null; openingEditMode = false; editingLedgerId = null; editLedgerDraft = null; }
  if(page !== 'users'){ editingCbId = null; }
  CURRENT_PAGE = page;
  document.querySelectorAll('.nav-item').forEach(n=> n.classList.toggle('active', n.dataset.page===page));
  render();
}

/* ================= HELPERS ================= */
function ledgerNetBalance(loc, cur){
  if(loc==='mahzan' || !STATE.cashboxes[loc] || !LEDGER_CURRENCIES.includes(cur)) return 0;
  const l = STATE.cashLedger[loc];
  if(!l) return 0;
  const inc = l.entries.filter(e=>e.type==='income').reduce((s,e)=> s+(e.amounts[cur]||0), 0);
  const exp = l.entries.filter(e=>e.type==='expense').reduce((s,e)=> s+(e.amounts[cur]||0), 0);
  return (l.opening[cur]||0) + inc - exp;
}
function sumBalance(loc, cur){
  let denomSum = 0;
  if(STATE.balances[loc] && STATE.balances[loc][cur]){
    denomSum = Object.entries(STATE.balances[loc][cur]).reduce((s,[d,c])=> s + (parseFloat(d)*c), 0);
  }
  return denomSum + ledgerNetBalance(loc, cur);
}
function fmt(n){ return n.toLocaleString('ru-RU',{minimumFractionDigits:(n%1!==0?2:0), maximumFractionDigits:2}); }
function fmtMoney(n, cur){ return fmt(n) + ' ' + (CURRENCIES[cur]?CURRENCIES[cur].symbol:cur); }
function showToast(msg){ const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),2800); }
function nextTrNumber(){ STATE.trCounter += 1; const y=new Date().getFullYear(); return 'TR-'+y+'-'+String(STATE.trCounter).padStart(6,'0'); }
function nowTs(){ const d=new Date(); return d.toLocaleDateString('tg-TJ')+' '+d.toLocaleTimeString('tg-TJ',{hour:'2-digit',minute:'2-digit'}); }
function canEditBalances(){ return CURRENT_USER.role==='admin' || CURRENT_USER.role==='mudir'; }
function dayIsClosed(){ return STATE.businessDay.closed; }
async function saveWorkbook(wb, filename){
  const buf = await wb.xlsx.writeBuffer();
  const blob = new Blob([buf], {type:'application/octet-stream'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function styleHeaderRow(row, fillArgb){
  row.eachCell(c=>{
    c.font = {bold:true, color:{argb:'FFFFFFFF'}};
    c.fill = {type:'pattern', pattern:'solid', fgColor:{argb: fillArgb || 'FFC19A5B'}};
    c.alignment = {horizontal:'center', vertical:'middle'};
    c.border = {top:{style:'thin',color:{argb:'FF888888'}}, left:{style:'thin',color:{argb:'FF888888'}}, bottom:{style:'thin',color:{argb:'FF888888'}}, right:{style:'thin',color:{argb:'FF888888'}}};
  });
}
function borderAllCells(ws){
  ws.eachRow(r=> r.eachCell(c=>{
    c.border = {top:{style:'thin',color:{argb:'FFDDDDDD'}}, left:{style:'thin',color:{argb:'FFDDDDDD'}}, bottom:{style:'thin',color:{argb:'FFDDDDDD'}}, right:{style:'thin',color:{argb:'FFDDDDDD'}}};
  }));
}
async function exportSimpleStyled(filename, sheetName, rows){
  if(typeof ExcelJS==='undefined'){ showToast('Excel module not loaded'); return; }
  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet(sheetName.slice(0,28));
  const safeRows = rows && rows.length ? rows : [{' ':''}];
  const headers = Object.keys(safeRows[0]);
  ws.columns = headers.map(h=>({header:h, key:h, width: Math.max(12, h.length+4)}));
  ws.addRows(safeRows);
  styleHeaderRow(ws.getRow(1), 'FFC19A5B');
  borderAllCells(ws);
  await saveWorkbook(wb, filename);
}
async function exportMultiSheetStyled(filename, sheetsObj){
  if(typeof ExcelJS==='undefined'){ showToast('Excel module not loaded'); return; }
  const wb = new ExcelJS.Workbook();
  Object.entries(sheetsObj).forEach(([name, rows])=>{
    const ws = wb.addWorksheet(name.slice(0,28));
    const safeRows = rows && rows.length ? rows : [{' ':''}];
    const headers = Object.keys(safeRows[0]);
    ws.columns = headers.map(h=>({header:h, key:h, width: Math.max(12, h.length+4)}));
    ws.addRows(safeRows);
    styleHeaderRow(ws.getRow(1), 'FFC19A5B');
    borderAllCells(ws);
  });
  await saveWorkbook(wb, filename);
}
async function exportLedgerStyled(cashboxId, day, incomeEntries, expenseEntries){
  if(typeof ExcelJS==='undefined'){ showToast('Excel module not loaded'); return; }
  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet(t('ledger_panel_title').slice(0,28));
  const cur5 = LEDGER_CURRENCIES; // TJS,USD,EUR,RUB,CNY
  const n = cur5.length;
  const c1a=1, c1b=2, c1c=3, c1cEnd=2+n;          // income: No, Note, currencies
  const spacer = c1cEnd+1;                          // 8
  const c2a=spacer+1, c2b=spacer+2, c2c=spacer+3, c2cEnd=spacer+2+n; // expense block
  const totalCols = c2cEnd;

  ws.columns = [
    {width:5},{width:22}, ...cur5.map(()=>({width:12})), {width:3},
    {width:5},{width:22}, ...cur5.map(()=>({width:12})),
  ];

  ws.mergeCells(1,1,1,totalCols);
  const title = ws.getCell(1,1);
  title.value = `${t('ledger_panel_title')} — ${cashboxLabel(cashboxId)} — ${day}`;
  title.font = {bold:true, size:14, color:{argb:'FF10192B'}};
  title.alignment = {horizontal:'center', vertical:'middle'};
  ws.getRow(1).height = 26;

  ws.mergeCells(2, c1a, 2, c1cEnd);
  const incHead = ws.getCell(2, c1a);
  incHead.value = t('income'); incHead.font={bold:true,size:12,color:{argb:'FFFFFFFF'}};
  incHead.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF2E7D46'}}; incHead.alignment={horizontal:'center',vertical:'middle'};
  ws.mergeCells(2, c2a, 2, c2cEnd);
  const expHead = ws.getCell(2, c2a);
  expHead.value = t('expense'); expHead.font={bold:true,size:12,color:{argb:'FFFFFFFF'}};
  expHead.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFB0413E'}}; expHead.alignment={horizontal:'center',vertical:'middle'};

  const hRow = ws.getRow(3);
  hRow.getCell(c1a).value = t('th_no'); hRow.getCell(c1b).value = t('th_note');
  cur5.forEach((c,i)=> hRow.getCell(c1c+i).value = c);
  hRow.getCell(c2a).value = t('th_no'); hRow.getCell(c2b).value = t('th_note');
  cur5.forEach((c,i)=> hRow.getCell(c2c+i).value = c);
  [c1a,c1b,...cur5.map((_,i)=>c1c+i)].forEach(ci=>{ const cell=hRow.getCell(ci); cell.font={bold:true}; cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFDDEFE0'}}; cell.alignment={horizontal:'center'}; });
  [c2a,c2b,...cur5.map((_,i)=>c2c+i)].forEach(ci=>{ const cell=hRow.getCell(ci); cell.font={bold:true}; cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFF3DCDA'}}; cell.alignment={horizontal:'center'}; });

  const maxLen = Math.max(incomeEntries.length, expenseEntries.length, 1);
  const incTotals = {}, expTotals = {};
  for(let i=0;i<maxLen;i++){
    const r = ws.getRow(4+i);
    const ie = incomeEntries[i];
    if(ie){
      r.getCell(c1a).value = i+1; r.getCell(c1b).value = ie.note||'';
      cur5.forEach((c,ci)=>{ const v = ie.amounts[c]||0; if(v){ r.getCell(c1c+ci).value = v; incTotals[c]=(incTotals[c]||0)+v; } });
    }
    const ee = expenseEntries[i];
    if(ee){
      r.getCell(c2a).value = i+1; r.getCell(c2b).value = ee.note||'';
      cur5.forEach((c,ci)=>{ const v = ee.amounts[c]||0; if(v){ r.getCell(c2c+ci).value = v; expTotals[c]=(expTotals[c]||0)+v; } });
    }
  }

  const totRowIdx = 4+maxLen;
  const totRow = ws.getRow(totRowIdx);
  ws.mergeCells(totRowIdx, c1a, totRowIdx, c1b);
  totRow.getCell(c1a).value = t('total_row')+':'; totRow.getCell(c1a).font={bold:true};
  cur5.forEach((c,ci)=>{ const cell=totRow.getCell(c1c+ci); cell.value = incTotals[c]||0; cell.font={bold:true}; });
  ws.mergeCells(totRowIdx, c2a, totRowIdx, c2b);
  totRow.getCell(c2a).value = t('total_row')+':'; totRow.getCell(c2a).font={bold:true};
  cur5.forEach((c,ci)=>{ const cell=totRow.getCell(c2c+ci); cell.value = expTotals[c]||0; cell.font={bold:true}; });
  totRow.eachCell(c=>{ c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFF0EBDD'}}; });

  const ledger = ledgerFor(cashboxId);
  const balTitleRow = totRowIdx+2;
  ws.mergeCells(balTitleRow,1,balTitleRow,5);
  const bt = ws.getCell(balTitleRow,1); bt.value = t('closing_title'); bt.font={bold:true,size:12};
  const balHeadRow = ws.getRow(balTitleRow+1);
  ['th_currency','th_opening','th_income','th_expense','th_closing'].forEach((k,i)=>{ balHeadRow.getCell(i+1).value = t(k); });
  styleHeaderRow(balHeadRow, 'FFC19A5B');
  cur5.forEach((c,i)=>{
    const opening = ledger.opening[c]||0;
    const income = incTotals[c]||0, expense = expTotals[c]||0;
    const row = ws.getRow(balTitleRow+2+i);
    row.getCell(1).value = curLabel(c); row.getCell(2).value = opening; row.getCell(3).value = income;
    row.getCell(4).value = expense; row.getCell(5).value = opening+income-expense;
    row.getCell(5).font = {bold:true};
  });

  ws.getRow(3).eachCell(c=>{ c.border = {top:{style:'thin'},left:{style:'thin'},bottom:{style:'thin'},right:{style:'thin'}}; });
  await saveWorkbook(wb, `Кассави_${cashboxId}_${day}.xlsx`);
}

/* ================= RENDER ROUTER ================= */
function render(){
  buildNav();
  const el = document.getElementById('mainArea');
  el.innerHTML = '';
  switch(CURRENT_PAGE){
    case 'dashboard': renderDashboard(el); break;
    case 'mahzan':    renderMahzan(el); break;
    case 'kassa':     renderKassa(el); break;
    case 'requests':  renderRequests(el); break;
    case 'journal':   renderJournal(el); break;
    case 'reports':   renderReports(el); break;
    case 'users':     renderUsers(el); break;
    case 'settings':  renderSettings(el); break;
    default: el.innerHTML = '<div class="empty">—</div>';
  }
}

/* ================= DASHBOARD ================= */
function renderDashboard(el){
  el.insertAdjacentHTML('beforeend', `<div class="topline"><div><h2>${t('dash_welcome')} ${CURRENT_USER.name}</h2><p class="sub">${t('dash_sub')} ${STATE.businessDay.date}</p></div></div>`);
  let cardsHtml = '<div class="grid cols-4">';
  if(CURRENT_USER.role!=='kassir'){
    Object.keys(CURRENCIES).forEach(cur=>{
      const total = sumBalance('mahzan', cur);
      cardsHtml += `<div class="card stat-card"><div class="label">${t('mahzan_balance_prefix')} ${curLabel(cur)}</div><div class="value">${fmtMoney(total,cur)}</div><div class="foot">${t('current_balance')}</div></div>`;
    });
  } else {
    const cb = CURRENT_USER.cashbox;
    Object.keys(CURRENCIES).forEach(cur=>{
      const total = sumBalance(cb, cur);
      cardsHtml += `<div class="card stat-card"><div class="label">${cashboxLabel(cb)} · ${curLabel(cur)}</div><div class="value">${fmtMoney(total,cur)}</div><div class="foot">${t('current_balance')}</div></div>`;
    });
  }
  cardsHtml += '</div>';
  el.insertAdjacentHTML('beforeend', cardsHtml);
  const isKassir = CURRENT_USER.role==='kassir';
  const recentReq = STATE.requests.filter(r=> !isKassir || r.cashbox===CURRENT_USER.cashbox).slice().reverse().slice(0,6);
  el.insertAdjacentHTML('beforeend', `
    <div class="panel" style="margin-top:20px;">
      <div class="panel-head"><h3>${t('recent_ops')}</h3></div>
      ${recentReq.length? renderRequestsTable(recentReq, false) : `<div class="empty">${t('no_ops')}</div>`}
    </div>
  `);

  el.insertAdjacentHTML('beforeend', `
    <div class="panel">
      <div class="panel-head"><h3>${t('my_password_title')}</h3></div>
      <div id="myPwForm"></div>
    </div>
  `);
  renderMyPasswordForm(document.getElementById('myPwForm'));
}

function renderMyPasswordForm(el){
  el.innerHTML = `
    <div class="form-row">
      <div class="field"><label>${t('pw_current')}</label><input type="password" id="myPwCurrent"></div>
      <div class="field"><label>${t('pw_new')}</label><input type="password" id="myPwNew"></div>
      <div class="field"><label>${t('pw_confirm')}</label><input type="password" id="myPwConfirm"></div>
    </div>
    <button class="btn" id="myPwSaveBtn">${t('pw_save_btn')}</button>
    <div id="myPwMsg" class="muted" style="font-size:12.5px;margin-top:10px;"></div>
  `;
  document.getElementById('myPwSaveBtn').onclick = async ()=>{
    const cur = document.getElementById('myPwCurrent').value;
    const nw = document.getElementById('myPwNew').value;
    const cf = document.getElementById('myPwConfirm').value;
    const msg = document.getElementById('myPwMsg');
    const u = STATE.users[CURRENT_USER.key];
    if(!u || u.password !== cur){ msg.style.color='var(--red)'; msg.textContent = t('pw_wrong_current'); return; }
    if(!nw || nw.length < 4){ msg.style.color='var(--red)'; msg.textContent = t('pw_too_short'); return; }
    if(nw !== cf){ msg.style.color='var(--red)'; msg.textContent = t('pw_mismatch'); return; }
    u.password = nw;
    CURRENT_USER.password = nw;
    await saveState();
    msg.style.color='var(--green)'; msg.textContent = t('toast_pw_changed');
    document.getElementById('myPwCurrent').value = '';
    document.getElementById('myPwNew').value = '';
    document.getElementById('myPwConfirm').value = '';
  };
}

async function deleteLedgerEntry(cashboxId, entryId){
  const ledger = ledgerFor(cashboxId);
  const idx = ledger.entries.findIndex(e=>e.id===entryId);
  if(idx===-1) return;
  const entry = ledger.entries[idx];
  if(!confirm(LANG==='ru' ? 'Удалить эту операцию? Это действие необратимо.' : 'Ин амалиётро нест мекунед? Ин амал бебозгашт аст.')) return;
  const summary = LEDGER_CURRENCIES.filter(c=>entry.amounts[c]).map(c=>`${fmt(entry.amounts[c])} ${c}`).join(', ');
  ledger.entries.splice(idx,1);
  STATE.journal.push({
    id:'AUD-'+Date.now(), trNumber:null, ts:nowTs(), type:'audit_edit', location:cashboxId,
    note:`Ledger entry deleted by ${CURRENT_USER.name} (${entry.type}, ${summary || '—'}, note: ${entry.note||'—'})`,
    by:CURRENT_USER.name, device:navigator.userAgent.slice(0,40)
  });
  if(editingLedgerId===entryId){ editingLedgerId=null; editLedgerDraft=null; }
  await saveState();
  showToast(t('toast_op_edited'));
  render();
}

function renderLedgerTable(entries, type, cashboxId, canManage){
  if(!entries.length) return `<div class="empty">${t('no_entries')}</div>`;
  const totals = {};
  const rows = entries.map((e,idx)=>{
    LEDGER_CURRENCIES.forEach(c=>{ if(e.amounts[c]) totals[c]=(totals[c]||0)+e.amounts[c]; });
    const cells = LEDGER_CURRENCIES.map(c=> `<td class="right num">${e.amounts[c]?fmt(e.amounts[c]):'—'}</td>`).join('');
    const editedNote = e.editedBy ? `<div class="muted" style="font-size:11px;">✏️ ${e.editedBy}</div>` : '';
    const actions = canManage ? `<td><button class="icon-btn" data-editledger="${e.id}" title="Edit">✏️</button><button class="icon-btn" data-delledger="${e.id}" title="Delete">🗑</button></td>` : '';
    return `<tr><td>${idx+1}</td><td>${e.note||'—'}<div class="muted" style="font-size:11px;">${e.ts} · ${e.by}</div>${editedNote}</td>${cells}${actions}</tr>`;
  }).join('');
  const totalCells = LEDGER_CURRENCIES.map(c=> `<td class="right num" style="color:var(--brass-bright);font-weight:600;">${totals[c]?fmt(totals[c]):'—'}</td>`).join('');
  return `<table class="ledger-table"><thead class="${type}"><tr><th>${t('th_no')}</th><th>${t('th_note')}</th>${LEDGER_CURRENCIES.map(c=>`<th class="right">${c}</th>`).join('')}${canManage?'<th></th>':''}</tr></thead>
    <tbody>${rows}<tr><td></td><td><b>${t('total_row')}</b></td>${totalCells}${canManage?'<td></td>':''}</tr></tbody></table>`;
}
function renderOpeningBalanceBox(box, cashboxId, incomeEntries, expenseEntries){
  const ledger = ledgerFor(cashboxId);
  function draw(){
    if(!openingEditMode){
      const rows = LEDGER_CURRENCIES.map(c=>{
        const opening = ledger.opening[c] || 0;
        const income = incomeEntries.reduce((s,e)=> s+(e.amounts[c]||0),0);
        const expense = expenseEntries.reduce((s,e)=> s+(e.amounts[c]||0),0);
        const closing = opening + income - expense;
        return `<tr><td>${curLabel(c)}</td><td class="right num">${fmt(opening)}</td><td class="right num" style="color:var(--green);">${fmt(income)}</td><td class="right num" style="color:var(--red);">${fmt(expense)}</td><td class="right num" style="color:var(--brass-bright);font-weight:600;">${fmt(closing)}</td></tr>`;
      }).join('');
      box.innerHTML = `<table><thead><tr><th>${t('th_currency')}</th><th class="right">${t('th_opening')}</th><th class="right">${t('th_income')}</th><th class="right">${t('th_expense')}</th><th class="right">${t('th_closing')}</th></tr></thead><tbody>${rows}</tbody></table>
        ${canEditBalances() ? `<div style="margin-top:12px;"><button class="btn ghost small" id="editOpeningBtn">${t('edit_opening_btn')}</button></div>` : ''}`;
      if(canEditBalances()){
        box.querySelector('#editOpeningBtn').onclick = ()=>{ openingEditMode = true; draw(); };
      }
    } else {
      const inputs = LEDGER_CURRENCIES.map(c=> `<div class="denom-box"><div class="d">${c}</div><input type="number" min="0" step="0.01" data-cur="${c}" class="opening-input" value="${ledger.opening[c]||0}"></div>`).join('');
      box.innerHTML = `<div class="amt-grid">${inputs}</div>
        <div style="display:flex;gap:10px;margin-top:10px;">
          <button class="btn" id="saveOpeningBtn">${t('save_opening_btn')}</button>
          <button class="btn ghost" id="cancelOpeningBtn">${t('cancel_btn')}</button>
        </div>`;
      box.querySelector('#saveOpeningBtn').onclick = async ()=>{
        box.querySelectorAll('.opening-input').forEach(inp=>{ ledger.opening[inp.dataset.cur] = parseFloat(inp.value)||0; });
        await saveState();
        openingEditMode = false;
        showToast(t('toast_opening_saved'));
        render();
      };
      box.querySelector('#cancelOpeningBtn').onclick = ()=>{ openingEditMode = false; draw(); };
    }
  }
  draw();
}

async function deleteRequest(id){
  const req = STATE.requests.find(r=>r.id===id);
  if(!req) return;
  const msg = LANG==='ru'
    ? 'Удалить эту операцию безвозвратно? Остаток кассы и хранилища будет пересчитан.'
    : 'Ин амалиётро бебозгашт нест мекунед? Бақияи касса ва махзан аз нав ҳисоб карда мешавад.';
  if(!confirm(msg)) return;
  applyTransfer(req.cashbox, req.currency, req.direction, req.items, -1);
  STATE.requests = STATE.requests.filter(r=>r.id!==id);
  STATE.journal = STATE.journal.filter(j=>j.reqId!==id);
  const summary = req.items.filter(i=>i.count>0).map(i=>`${i.count}×${fmt(parseFloat(i.denom))}`).join(', ');
  STATE.journal.push({
    id:'AUD-'+Date.now(), trNumber:null, ts:nowTs(), type:'audit_edit', location:req.cashbox,

async function submitRequest(){
  const items = Object.entries(reqDraft.items).filter(([d,c])=>c>0).map(([denom,count])=>({denom,count}));
  if(items.length===0){ showToast(t('toast_denom_needed')); return; }
  const total = items.reduce((s,i)=> s+ parseFloat(i.denom)*i.count, 0);
  const loc = CURRENT_USER.cashbox;
  const direction = reqDraft.direction, currency = reqDraft.currency;
  applyTransfer(loc, currency, direction, items, 1);
  const trNumber = nextTrNumber();
  const req = { id:'REQ-'+Date.now(), cashbox:loc, direction, currency, items, total, status:'approved',
    createdBy:CURRENT_USER.name, createdTs:nowTs(), decidedBy:CURRENT_USER.name, decidedTs:nowTs(), trNumber };
  STATE.requests.push(req);
  STATE.journal.push({ id:'J-'+Date.now(), trNumber, ts:nowTs(), type:'transfer', cashbox:loc, direction, currency, items, total,
    by:CURRENT_USER.name, device:navigator.userAgent.slice(0,40), day:STATE.businessDay.date, reqId:req.id });
  await saveState();
  reqDraft = null;
  showToast(t('toast_op_executed'));
  render();
}
function applyTransfer(loc, currency, direction, items, sign){
  for(const it of items){
    const d = it.denom, c = it.count * sign;
    if(direction==='from_mahzan'){
      STATE.balances['mahzan'][currency][d] = (STATE.balances['mahzan'][currency][d]||0) - c;
      STATE.balances[loc][currency][d] = (STATE.balances[loc][currency][d]||0) + c;
    } else {
      STATE.balances[loc][currency][d] = (STATE.balances[loc][currency][d]||0) - c;
      STATE.balances['mahzan'][currency][d] = (STATE.balances['mahzan'][currency][d]||0) + c;
    }
  }
}

async function saveEditedRequest(req){
  const items = Object.entries(editReqDraft).filter(([d,c])=>c>0).map(([denom,count])=>({denom,count}));
  if(items.length===0){ showToast(t('toast_denom_needed')); return; }
  const newTotal = items.reduce((s,i)=> s + parseFloat(i.denom)*i.count, 0);
  const oldSummary = req.items.filter(i=>i.count>0).map(i=> `${i.count}×${fmt(parseFloat(i.denom))}`).join(', ');
  const newSummary = items.map(i=> `${i.count}×${fmt(parseFloat(i.denom))}`).join(', ');
  applyTransfer(req.cashbox, req.currency, req.direction, req.items, -1);
  applyTransfer(req.cashbox, req.currency, req.direction, items, 1);
  req.items = items; req.total = newTotal; req.editedBy = CURRENT_USER.name; req.editedTs = nowTs();

    note:`Correction of ${req.trNumber||req.id} by ${CURRENT_USER.name}: "${oldSummary}" -> "${newSummary}"`,
    by:CURRENT_USER.name, device:navigator.userAgent.slice(0,40) });

function computeDenomBreakdown(){
  const today = STATE.businessDay.date;
  const filtered = STATE.journal.filter(j=> j.type==='transfer' && j.day===today && (reportCashboxFilter==='all' || j.cashbox===reportCashboxFilter));
  const out = {};
  Object.keys(CURRENCIES).forEach(cur=>{
    const received = {}, given = {};
    filtered.filter(j=>j.currency===cur).forEach(j=>{
      const target = j.direction==='from_mahzan' ? received : given;
      j.items.forEach(it=> target[it.denom] = (target[it.denom]||0) + it.count);
    });
    out[cur] = {received, given};
  });
  return out;
}
function renderDenomBreakdown(){
  const body = document.getElementById('denomBreakdownBody');
  if(!body) return;
  const data = computeDenomBreakdown();
  let html = '';
  Object.keys(CURRENCIES).forEach(cur=>{
    const {received, given} = data[cur];
    const denomsUsed = new Set([...Object.keys(received), ...Object.keys(given)]);
    if(denomsUsed.size===0) return;
    const rows = CURRENCIES[cur].denoms.filter(d=> denomsUsed.has(String(d))).map(d=>{
      const r = received[d]||0, g = given[d]||0;
      return `<tr><td class="num">${fmt(d)}</td><td class="right num" style="color:var(--green);">${r||'—'}</td><td class="right num" style="color:var(--red);">${g||'—'}</td></tr>`;
    }).join('');
    html += `<h3 style="font-size:14px;color:var(--brass-bright);margin:16px 0 8px;">${curLabel(cur)}</h3>
      <table><thead><tr><th>${t('th_denom')}</th><th class="right">${t('received_count_th')}</th><th class="right">${t('given_count_th')}</th></tr></thead><tbody>${rows}</tbody></table>`;
  });
  body.innerHTML = html || `<div class="empty">${t('no_ops_filter')}</div>`;
}
function exportDenomBreakdown(){
  const data = computeDenomBreakdown();
  const sheets = {};
  Object.keys(CURRENCIES).forEach(cur=>{
    const {received, given} = data[cur];
    const denomsUsed = new Set([...Object.keys(received), ...Object.keys(given)]);
    if(denomsUsed.size===0) return;
    const rows = CURRENCIES[cur].denoms.filter(d=> denomsUsed.has(String(d))).map(d=>({
      [t('th_denom')]: d, [t('received_count_th')]: received[d]||0, [t('given_count_th')]: given[d]||0
    }));
    sheets[cur] = rows;
  });
  if(Object.keys(sheets).length===0){ showToast(t('no_ops_filter')); return; }
  exportMultiSheetStyled(`Купюрахо_${STATE.businessDay.date}.xlsx`, sheets);
}

    <button class="btn" id="addCbBtn">${t('add_cashbox_btn')}</button>`;
  el.appendChild(cbPanel);

  if(editingCbId){
    document.getElementById('saveCbEditBtn').onclick = async ()=>{
      const oldId = editingCbId;
      let newId = document.getElementById('editCbIdInput').value.trim().replace(/\s+/g,'_');
      const newLabel = document.getElementById('editCbLabelInput').value.trim();
      if(!newId || !newLabel){ showToast(t('toast_cb_needed')); return; }
      if(newId !== oldId && STATE.cashboxes[newId]){ showToast('ID аллакай истифода мешавад / ID уже используется'); return; }
      renameCashbox(oldId, newId, newLabel);
      await saveState();
      editingCbId = null;
      showToast(t('toast_pw_changed'));
      render();
    };
    document.getElementById('cancelCbEditBtn').onclick = ()=>{ editingCbId = null; render(); };
  }
  document.querySelectorAll('[data-editcb]').forEach(b=>{
    b.onclick = ()=>{ editingCbId = b.dataset.editcb; render(); };
  });

  document.querySelectorAll('[data-setpw]').forEach(b=>{
    b.onclick = async ()=>{
      const key = b.dataset.setpw, input = document.getElementById('pw_'+key), val = input.value.trim();
      if(!val){ showToast(t('toast_pw_needed')); return; }
      STATE.users[key].password = val;
      await saveState();
      showToast(t('toast_pw_changed'));
      input.value='';
    };
  });
  document.querySelectorAll('[data-delcb]').forEach(b=>{
    b.onclick = async ()=>{
      const id = b.dataset.delcb;
      if(!confirm(t('delete_cb_confirm'))) return;
      delete STATE.cashboxes[id]; delete STATE.balances[id]; delete STATE.cashLedger[id];
      Object.keys(STATE.users).forEach(uk=>{ if(STATE.users[uk].cashbox===id) delete STATE.users[uk]; });
      if(selectedKassaView===id) selectedKassaView = Object.keys(STATE.cashboxes)[0] || null;
      await saveState(); showToast(t('toast_cb_deleted')); render();
    };
  });
  document.getElementById('addCbBtn').onclick = async ()=>{
    const label = document.getElementById('newCbLabel').value.trim();
    let id = document.getElementById('newCbId').value.trim().replace(/\s+/g,'_');
    if(!label){ showToast(t('toast_cb_needed')); return; }
    if(!id) id = 'kassa_' + Date.now().toString(36);
    if(STATE.cashboxes[id]){ showToast('ID аллакай истифода мешавад / ID уже используется'); return; }
    STATE.cashboxes[id] = { label };
    STATE.balances[id] = {};
    Object.keys(CURRENCIES).forEach(cur=>{ STATE.balances[id][cur] = {}; CURRENCIES[cur].denoms.forEach(d=> STATE.balances[id][cur][d]=0); });
    STATE.cashLedger[id] = { opening:{}, entries:[] };
    STATE.users[id] = { name:'Кассир — '+label, role:'kassir', cashbox:id, password:'kassa123' };
    await saveState();
    showToast(t('toast_cb_added')+' Логин: '+id+' / kassa123');
    render();
  };
}

function renameCashbox(oldId, newId, newLabel){
  if(newId === oldId){
    STATE.cashboxes[oldId].label = newLabel;
    return;
  }
  STATE.cashboxes[newId] = { label:newLabel };
  STATE.balances[newId] = STATE.balances[oldId];
  STATE.cashLedger[newId] = STATE.cashLedger[oldId];
  delete STATE.cashboxes[oldId]; delete STATE.balances[oldId]; delete STATE.cashLedger[oldId];

  // move the associated kassir user to the new key so login stays in sync
  const userEntry = Object.entries(STATE.users).find(([,u])=> u.cashbox===oldId);
  if(userEntry){
    const [oldUserKey, u] = userEntry;
    u.cashbox = newId;
    if(oldUserKey === oldId){
      STATE.users[newId] = u;
      delete STATE.users[oldUserKey];
    }
  }
  // re-point historical records so nothing gets orphaned
  STATE.requests.forEach(r=>{ if(r.cashbox===oldId) r.cashbox = newId; });
  STATE.journal.forEach(j=>{ if(j.cashbox===oldId) j.cashbox = newId; if(j.location===oldId) j.location = newId; });
  if(selectedKassaView===oldId) selectedKassaView = newId;
  if(CURRENT_USER && CURRENT_USER.cashbox===oldId) CURRENT_USER.cashbox = newId;
}

/* ================= SETTINGS ================= */
function renderSettings(el){
  el.insertAdjacentHTML('beforeend', `<div class="topline"><div><h2>${t('settings_title')}</h2><p class="sub">${t('settings_sub')}</p></div></div>`);
  const closed = STATE.businessDay.closed;
  const panel = document.createElement('div'); panel.className='panel';
  panel.innerHTML = `
    <div class="panel-head"><h3>${STATE.businessDay.date}</h3><span class="tag ${closed?'rejected':'approved'}">${closed?t('closed_tag'):t('open_tag')}</span></div>
    <p class="muted" style="font-size:13.5px;line-height:1.6;">${t('biz_day_desc')}</p>
    <div style="display:flex;gap:10px;margin-top:14px;">
      ${!closed ? `<button class="btn" id="closeDayBtn">${t('close_day_btn')}</button>` : ''}
      ${closed && CURRENT_USER.role==='admin' ? `<button class="btn ghost" id="reopenDayBtn">${t('reopen_day_btn')}</button>` : ''}
      ${closed && CURRENT_USER.role==='admin' ? `<button class="btn" id="newDayBtn">${t('new_day_btn')}</button>` : ''}
    </div>`;
  el.appendChild(panel);
  const btn1 = document.getElementById('closeDayBtn'); if(btn1) btn1.onclick = async ()=>{ STATE.businessDay.closed=true; await saveState(); showToast(t('toast_day_closed')); render(); };
  const btn2 = document.getElementById('reopenDayBtn'); if(btn2) btn2.onclick = async ()=>{ STATE.businessDay.closed=false; await saveState(); showToast(t('toast_day_reopened')); render(); };
  const btn3 = document.getElementById('newDayBtn'); if(btn3) btn3.onclick = async ()=>{ STATE.businessDay = {date: todayStr(), closed:false}; await saveState(); showToast(t('toast_new_day')); render(); };

  const auditPanel = document.createElement('div'); auditPanel.className='panel';
  const audits = STATE.journal.filter(j=>j.type==='audit_edit').slice().reverse().slice(0,20);
  auditPanel.innerHTML = `<div class="panel-head"><h3>${t('audit_title')}</h3></div>
    ${audits.length ? `<table><thead><tr><th>${t('th_when')}</th><th>${t('th_where')}</th><th>${t('th_desc')}</th><th>${t('th_who')}</th></tr></thead><tbody>
      ${audits.map(a=>`<tr><td class="muted" style="font-size:12px;">${a.ts}</td><td>${a.location==='mahzan'?t('mahzan_title'):cashboxLabel(a.location)}</td><td>${a.note}</td><td>${a.by}</td></tr>`).join('')}
    </tbody></table>` : `<div class="empty">${t('no_audit')}</div>`}`;
  el.appendChild(auditPanel);
}

/* ================= INIT ================= */
(async function init(){
  loadTheme();
  await loadLang();
  await loadState();
  populateLoginUsers();
  applyStaticTranslations();
  document.getElementById('langTjLogin').onclick = ()=> setLang('tj');
  document.getElementById('langRuLogin').onclick = ()=> setLang('ru');
  document.getElementById('themeToggle').onclick = toggleTheme;
  document.getElementById('themeToggleLogin').onclick = toggleTheme;
  document.getElementById('founderLink').onclick = openFounderModal;
  document.getElementById('founderModalClose').onclick = closeFounderModal;
  document.getElementById('founderModal').onclick = (e)=>{ if(e.target.id==='founderModal') closeFounderModal(); };
})();

function openFounderModal(){
  document.getElementById('founderTitle').textContent = t('founder_title');
  document.getElementById('founderBio').textContent = t('founder_bio');
  document.getElementById('founderModal').classList.add('show');
}
function closeFounderModal(){
  document.getElementById('founderModal').classList.remove('show');
}
</script>
