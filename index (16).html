<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Azim Core</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
  :root{
    --navy-deep:#10192b; --navy:#16223b; --navy-light:#1f2f4d; --panel:#1a2740; --line:#2c3c5c;
    --brass:#c19a5b; --brass-bright:#e0bd7d; --ivory:#f2ede2; --ivory-dim:#b9c0cf;
    --green:#5fae76; --green-bg:#173425; --red:#d3695f; --red-bg:#3a2018; --amber:#dba24a; --amber-bg:#3a2f14; --radius:10px; --btn-ink:#1b2438;
    --bg-glow-1:#1c2c4d; --bg-glow-2:#24345530;
  }
  :root[data-theme="light"]{
    --navy-deep:#f3efe4; --navy:#ffffff; --navy-light:#ffffff; --panel:#ffffff; --line:#e2ddcf;
    --brass:#a6793a; --brass-bright:#8a6229; --ivory:#20293c; --ivory-dim:#5b6376;
    --green:#2f7d46; --green-bg:#e2f3e6; --red:#c1443b; --red-bg:#fbe5e3; --amber:#9c6a1c; --amber-bg:#faf0dc; --btn-ink:#ffffff;
    --bg-glow-1:#e3dcc6; --bg-glow-2:#d8ceb355;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(1200px 600px at 15% -10%, var(--bg-glow-1) 0%, transparent 55%),
      radial-gradient(1000px 500px at 110% 10%, var(--bg-glow-2) 0%, transparent 50%), var(--navy-deep);
    color:var(--ivory); font-family:'Inter',sans-serif; min-height:100vh;
  }
  h1,h2,h3,.display{font-family:'Fraunces',serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  ::selection{background:var(--brass);color:var(--btn-ink);}
  #login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .login-card{width:100%;max-width:420px;background:linear-gradient(180deg,var(--navy-light),var(--panel));border:1px solid var(--line);border-radius:16px;padding:40px 36px;box-shadow:0 30px 60px -20px rgba(0,0,0,.6);position:relative;overflow:hidden;}
  .login-card::before{content:"";position:absolute;top:-40%;left:-20%;width:180%;height:180%;background:radial-gradient(circle at 30% 20%, rgba(193,154,91,.10), transparent 55%);pointer-events:none;}
  .logo-full{width:150px;height:auto;margin:0 auto 18px;display:block;}
  .logo-mark{width:28px;height:28px;flex-shrink:0;}
  .login-card h1{font-size:26px;color:var(--ivory);margin:0 0 4px;font-weight:600;letter-spacing:.01em;}
  .login-sub{color:var(--ivory-dim);font-size:13.5px;margin:0 0 28px;letter-spacing:.02em;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--brass);margin-bottom:7px;}
  select,input[type=password],input[type=text],input[type=number]{width:100%;background:var(--navy-deep);border:1px solid var(--line);color:var(--ivory);padding:11px 13px;border-radius:8px;font-size:14.5px;font-family:'Inter',sans-serif;outline:none;transition:border-color .15s;}
  select:focus,input:focus{border-color:var(--brass);}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--brass);color:var(--btn-ink);border:none;padding:12px 20px;border-radius:8px;font-weight:600;font-size:14.5px;cursor:pointer;transition:transform .1s, background .15s;letter-spacing:.01em;}
  .btn:hover{background:var(--brass-bright);}
  .btn:active{transform:scale(.98);}
  .btn.full{width:100%;margin-top:6px;}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ivory-dim);}
  .btn.ghost:hover{border-color:var(--brass);color:var(--brass-bright);}
  .btn.danger{background:var(--red);color:#2a0f0d;}
  .btn.small{padding:7px 13px;font-size:13px;}
  .login-err{color:var(--red);font-size:13px;margin:-6px 0 14px;}
  .pw-field-wrap{position:relative;}
  .pw-field-wrap input{padding-right:42px;}
  .pw-eye-btn{position:absolute;top:50%;right:8px;transform:translateY(-50%);background:transparent;border:none;color:var(--ivory-dim);cursor:pointer;font-size:16px;padding:4px 6px;border-radius:6px;}
  .pw-eye-btn:hover{color:var(--brass-bright);}
  .login-hint{margin-top:22px;font-size:11.5px;color:#7c8aa3;line-height:1.6;border-top:1px dashed var(--line);padding-top:16px;}
  #app-screen{display:none;min-height:100vh;}
  .shell{display:flex;flex-direction:column;min-height:100vh;}
  .topbar{background:linear-gradient(180deg,#111b30,#0d1526);border-bottom:1px solid var(--line);padding:12px 22px;display:flex;align-items:center;flex-wrap:wrap;gap:10px 18px;position:sticky;top:0;z-index:400;}
  .brand{display:flex;align-items:center;gap:10px;padding:0 6px 0 0;}
  .brand .logo-mark{width:34px;height:34px;flex:none;}
  .brand-text{line-height:1.15;}
  .brand-text b{display:block;font-family:'Fraunces',serif;font-size:15.5px;color:var(--ivory);letter-spacing:.01em;}
  .brand-text span{font-size:9.5px;color:var(--ivory-dim);letter-spacing:.06em;}
  .branch-badge{padding:5px 12px;border-radius:20px;background:var(--brass);color:var(--btn-ink);font-size:11.5px;font-weight:700;letter-spacing:.02em;white-space:nowrap;}
  .userbox{padding:7px 12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;white-space:nowrap;}
  .userbox .name{font-weight:600;font-size:12.5px;color:var(--ivory);line-height:1.2;}
  .userbox .role{font-size:10px;color:var(--brass);text-transform:uppercase;letter-spacing:.06em;}
  .lang-fixed{position:fixed;top:14px;right:16px;display:flex;gap:4px;z-index:500;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:3px;box-shadow:0 6px 18px rgba(0,0,0,.35);}
  .sidebar-toolbar{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:3px;width:fit-content;}
  .lang-btn{padding:5px 11px;border-radius:16px;background:transparent;border:none;color:var(--ivory-dim);font-size:11px;font-weight:700;cursor:pointer;text-align:center;letter-spacing:.03em;}
  .lang-btn.active{background:var(--brass);color:var(--btn-ink);}
  nav{display:flex;flex-direction:row;flex-wrap:wrap;gap:2px;order:3;flex:1 1 100%;border-top:1px solid var(--line);margin-top:2px;padding-top:8px;}
  .nav-item{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;color:var(--ivory-dim);text-decoration:none;font-size:13.5px;cursor:pointer;border:1px solid transparent;transition:all .12s;white-space:nowrap;}
  .nav-item:hover{background:var(--navy-light);color:var(--ivory);}
  .nav-item.active{background:var(--navy-light);color:var(--brass-bright);border-color:var(--line);font-weight:600;}
  .nav-icon{width:18px;text-align:center;}
  .day-badge{padding:7px 12px;border-radius:8px;font-size:11.5px;display:flex;align-items:center;gap:6px;white-space:nowrap;}
  .day-badge.open{background:var(--green-bg);color:var(--green);border:1px solid #285c3f;}
  .day-badge.closed{background:var(--red-bg);color:var(--amber);border:1px solid #5a3a24;}
  .sidebar-footer{text-align:center;font-size:10px;color:#5c6a85;letter-spacing:.04em;white-space:nowrap;}
  .founder-link{text-align:center;font-size:16px;cursor:pointer;color:var(--brass);}
  .founder-link:hover{color:var(--brass-bright);}
  .topbar-right{display:flex;align-items:center;gap:10px;margin-left:auto;}
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(5,8,16,.72);z-index:2000;align-items:center;justify-content:center;padding:24px;}
  .modal-overlay.show{display:flex;}
  .modal-card{position:relative;max-width:420px;width:100%;background:linear-gradient(180deg,var(--navy-light),var(--panel));border:1px solid var(--line);border-radius:16px;padding:34px 30px 28px;text-align:center;box-shadow:0 30px 70px -20px rgba(0,0,0,.6);max-height:88vh;overflow-y:auto;}
  .modal-close{position:absolute;top:14px;right:14px;font-size:16px;}
  .founder-photo{width:150px;height:150px;object-fit:cover;border-radius:50%;border:3px solid var(--brass);margin-bottom:18px;}
  .modal-card h2{font-size:19px;margin:0 0 4px;color:var(--ivory);}
  .founder-title{font-size:12.5px;color:var(--brass);text-transform:uppercase;letter-spacing:.05em;margin-bottom:16px;}
  .founder-bio{font-size:13.5px;color:var(--ivory-dim);line-height:1.75;text-align:left;white-space:pre-line;}
  .main{padding:30px 38px 60px;overflow-x:hidden;}
  .topline{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:26px;flex-wrap:wrap;gap:14px;}
  .topline h2{font-size:24px;margin:0 0 4px;color:var(--ivory);font-weight:600;}
  .topline .sub{color:var(--ivory-dim);font-size:13.5px;margin:0;}
  .grid{display:grid;gap:16px;}
  .grid.cols-4{grid-template-columns:repeat(4,1fr);}
  .grid.cols-3{grid-template-columns:repeat(3,1fr);}
  .grid.cols-2{grid-template-columns:repeat(2,1fr);}
  @media(max-width:1000px){.grid.cols-4{grid-template-columns:repeat(2,1fr);} .grid.cols-3{grid-template-columns:repeat(2,1fr);}}
  .card{background:linear-gradient(180deg,var(--navy-light),var(--panel));border:1px solid var(--line);border-radius:var(--radius);padding:20px;}
  .stat-card .label{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--brass);margin-bottom:8px;}
  .stat-card .value{font-family:'Fraunces',serif;font-size:26px;color:var(--ivory);font-weight:600;}
  .stat-card .foot{font-size:12px;color:var(--ivory-dim);margin-top:6px;}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin-bottom:20px;}
  .panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
  .panel-head h3{margin:0;font-size:16.5px;color:var(--ivory);font-weight:600;}
  .panel-head .actions{display:flex;gap:8px;flex-wrap:wrap;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;color:var(--brass);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:9px 10px;border-bottom:1px solid var(--line);}
  td{padding:9px 10px;border-bottom:1px solid #223252;color:var(--ivory);}
  tr:last-child td{border-bottom:none;}
  td input[type=number]{width:90px;padding:6px 8px;font-size:13px;}
  .num{font-family:'IBM Plex Mono',monospace;}
  .right{text-align:right;}
  .muted{color:var(--ivory-dim);}
  .tag{display:inline-flex;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:.02em;}
  .tag.pending{background:var(--amber-bg);color:var(--amber);}
  .tag.approved{background:var(--green-bg);color:var(--green);}
  .tag.rejected{background:var(--red-bg);color:var(--red);}
  .tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap;}
  .tab{padding:8px 15px;border-radius:20px;background:var(--panel);border:1px solid var(--line);color:var(--ivory-dim);font-size:13px;cursor:pointer;}
  .tab.active{background:var(--brass);color:var(--btn-ink);font-weight:600;border-color:var(--brass);}
  .form-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
  .form-row .field{flex:1;min-width:160px;margin-bottom:0;}
  .denom-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin:14px 0 18px;}
  .denom-box{background:var(--navy-deep);border:1px solid var(--line);border-radius:8px;padding:9px;}
  .denom-box .d{font-size:11px;color:var(--brass);margin-bottom:5px;font-family:'IBM Plex Mono',monospace;}
  .denom-box input{padding:6px 7px;font-size:13px;}
  .req-total{margin-top:6px;font-size:14px;color:var(--ivory-dim);}
  .req-total b{color:var(--brass-bright);font-family:'IBM Plex Mono',monospace;}
  .empty{padding:36px 10px;text-align:center;color:var(--ivory-dim);font-size:13.5px;}
  .toast{position:fixed;bottom:24px;right:24px;background:var(--brass);color:var(--btn-ink);padding:12px 18px;border-radius:8px;font-size:13.5px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.4);z-index:999;opacity:0;transform:translateY(8px);transition:all .25s;pointer-events:none;max-width:320px;}
  .toast.show{opacity:1;transform:translateY(0);}
  .badge-cash{font-size:11px;padding:2px 8px;border-radius:6px;background:var(--navy-deep);color:var(--brass-bright);margin-left:8px;font-family:'IBM Plex Mono',monospace;}
  .loading{padding:60px;text-align:center;color:var(--ivory-dim);}
  select.small{width:auto;padding:8px 12px;}
  .ledger-table thead.income th{background:var(--green-bg);color:var(--green);}
  .ledger-table thead.expense th{background:var(--red-bg);color:var(--red);}
  .ledger-wrap{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  @media(max-width:1100px){.ledger-wrap{grid-template-columns:1fr;}}
  .amt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin:12px 0;}
  .icon-btn{background:transparent;border:none;color:var(--ivory-dim);cursor:pointer;font-size:15px;padding:4px 6px;border-radius:6px;}
  .icon-btn:hover{background:var(--navy-light);color:var(--red);}
  .pw-row{display:flex;gap:8px;align-items:center;}
  .pw-row input{width:150px;}
</style>
</head>
<body>
<script>window.BRANCH_NAME = "%%BRANCH_NAME%%";</script>

<div id="login-screen">
  <div class="lang-fixed"><div class="lang-btn" id="themeToggleLogin" title="Тема">🌙</div><div class="lang-btn" id="langTjLogin">ТОҶ</div><div class="lang-btn" id="langRuLogin">РУС</div></div>
  <div class="login-card">
    <svg class="logo-full" viewBox="0 0 140 100" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="lgGold1" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#f0c675"/>
          <stop offset="100%" stop-color="#b8842f"/>
        </linearGradient>
      </defs>
      <text x="70" y="72" text-anchor="middle" font-size="80" font-weight="400" fill="url(#lgGold1)" font-family="Georgia,'Times New Roman',serif">A</text>
      <text x="70" y="92" text-anchor="middle" font-size="13" letter-spacing="4" fill="url(#lgGold1)" font-family="Georgia,serif">AZIM CORE</text>
    </svg>
    <p class="login-sub" id="loginSub">Системаи идоракунии хазинавии «Васл Бонк»</p>
    <div class="field"><label id="lblLoginUser">Корбар</label><input type="text" id="loginUser" autocomplete="username" placeholder="логин" onkeydown="if(event.key==='Enter'){ handleLogin(); }"></div>
    <div class="field"><label id="lblLoginPass">Рамз (Password)</label>
      <div class="pw-field-wrap">
        <input type="password" id="loginPass" placeholder="••••••••" onkeydown="if(event.key==='Enter'){ handleLogin(); }">
        <button type="button" class="pw-eye-btn" id="loginPassToggle" title="Show/Hide">👁</button>
      </div>
    </div>
    <div class="login-err" id="loginErr" style="display:none;"></div>
    <button class="btn full" id="loginBtn" onclick="handleLogin()">Вуруд</button>
    <div class="login-hint" id="loginHint">Бор шудан истодааст…</div>
  </div>
</div>

<div id="app-screen">
  <div class="shell">
    <div class="topbar">
      <div class="brand"><svg class="logo-mark" viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="lgGold2" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f0c675"/>
            <stop offset="100%" stop-color="#b8842f"/>
          </linearGradient>
        </defs>
        <text x="70" y="102" text-anchor="middle" font-size="112" font-weight="400" fill="url(#lgGold2)" font-family="Georgia,'Times New Roman',serif">A</text>
      </svg><div class="brand-text"><b>Azim Core</b><span id="brandSub">Хазинадорӣ V2</span></div></div>
      <div id="branchBadge" class="branch-badge" style="display:none;"></div>
      <div class="topbar-right">
        <div class="userbox"><div class="name" id="ubName"></div><div class="role" id="ubRole"></div></div>
        <div class="day-badge" id="dayBadge"></div>
        <div class="sidebar-toolbar"><div class="lang-btn" id="themeToggle" title="Тема">🌙</div><div class="lang-btn" id="langTj">ТОҶ</div><div class="lang-btn" id="langRu">РУС</div></div>
        <button class="btn ghost" id="logoutBtn" onclick="logout()">Баромад</button>
        <div class="founder-link" id="founderLink" title="Дар бораи муассис">ℹ️</div>
        <span style="font-size:10px;color:#5c6a85;white-space:nowrap;" title="© Абдуҳакимов Азимҷон Олимович. Ҳама ҳуқуқҳо ҳифз шудаанд.">© Azim Core</span>
      </div>
      <nav id="navList"></nav>
    </div>
    <div class="main" id="mainArea"><div class="loading">Бор шудан истодааст…</div></div>
  </div>
</div>

<div class="modal-overlay" id="founderModal">

function emptyBalancesFor(locs){
  const b = {};

  return b;
}
function emptyInventoryFor(locs, items){
  const b = {};
  locs.forEach(loc=>{ b[loc]={}; Object.keys(items).forEach(k=> b[loc][k]=0); });
  return b;
}
function defaultState(){

  const inventoryItems = JSON.parse(JSON.stringify(DEFAULT_INVENTORY_ITEMS));

  Object.keys(cashboxes).forEach(id=> cashboxAccounts[id] = {TJS:'',USD:'',EUR:'',RUB:''});
  cashboxAccounts.kassa1 = {TJS:'10117972100000563104', USD:'10119840000000425210', EUR:'10119978900000425211', RUB:'10119810400000425222'};
  if(cashboxAccounts.kassa_boz) cashboxAccounts.kassa_boz = {TJS:'10117972500010081849', USD:'', EUR:'', RUB:''};
  if(cashboxAccounts.kassa2) cashboxAccounts.kassa2 = {TJS:'10117972400000425201', USD:'10119840300000425208', EUR:'10119978200000425209', RUB:'10119810700000425207'};
  return { cashboxes, users, inventoryItems, balances: emptyBalancesFor(locs), inventoryBalances: emptyInventoryFor(locs, inventoryItems),
           cashLedger: ledger, cashboxAccounts, requests: [], journal: [],
           trCounter: 0, businessDay: { date: todayStr(), closed:false }, createdAt: Date.now() };
}
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

function normalizeState(raw){
  STATE = raw;
  let migrated = false;
  if(!STATE.cashboxes) STATE.cashboxes = JSON.parse(JSON.stringify(DEFAULT_CASHBOXES));
  if(!STATE.users){ STATE.users = JSON.parse(JSON.stringify(DEFAULT_USERS)); migrated = true; }
  if(!STATE.cashLedger) STATE.cashLedger = {};
  if(!STATE.cashboxAccounts) STATE.cashboxAccounts = {};
  Object.keys(STATE.cashboxes).forEach(id=>{ if(!STATE.cashboxAccounts[id]){ STATE.cashboxAccounts[id] = {TJS:'',USD:'',EUR:'',RUB:''}; migrated = true; } });
  if(!STATE.cashboxAccounts.kassa1 || !STATE.cashboxAccounts.kassa1.TJS){
    STATE.cashboxAccounts.kassa1 = {TJS:'10117972100000563104', USD:'10119840000000425210', EUR:'10119978900000425211', RUB:'10119810400000425222'};
    migrated = true;
  }
  if(STATE.cashboxAccounts.kassa_boz && !STATE.cashboxAccounts.kassa_boz.TJS){
    STATE.cashboxAccounts.kassa_boz = {TJS:'10117972500010081849', USD:'', EUR:'', RUB:''};
    migrated = true;
  }
  if(STATE.cashboxAccounts.kassa2 && !STATE.cashboxAccounts.kassa2.TJS){
    STATE.cashboxAccounts.kassa2 = {TJS:'10117972400000425201', USD:'10119840300000425208', EUR:'10119978200000425209', RUB:'10119810700000425207'};
    migrated = true;
  }
  if(!STATE.inventoryItems) STATE.inventoryItems = JSON.parse(JSON.stringify(DEFAULT_INVENTORY_ITEMS));
  if(!STATE.inventoryBalances) STATE.inventoryBalances = {};
  if(!STATE.balances) STATE.balances = {};
  if(!STATE.cashboxLocks) { STATE.cashboxLocks = {}; migrated = true; }
  const locs = ['mahzan', ...Object.keys(STATE.cashboxes)];
  const fresh = emptyBalancesFor(locs);
  Object.keys(fresh).forEach(loc=>{
    if(!STATE.balances[loc]) STATE.balances[loc] = fresh[loc];
    Object.keys(fresh[loc]).forEach(cur=>{
      if(!STATE.balances[loc][cur]) STATE.balances[loc][cur] = fresh[loc][cur];
      else Object.keys(fresh[loc][cur]).forEach(d=>{ if(STATE.balances[loc][cur][d]===undefined) STATE.balances[loc][cur][d]=0; });
    });
  });
  locs.forEach(loc=>{
    if(!STATE.inventoryBalances[loc]) STATE.inventoryBalances[loc] = {};
    Object.keys(STATE.inventoryItems).forEach(k=>{ if(STATE.inventoryBalances[loc][k]===undefined) STATE.inventoryBalances[loc][k]=0; });
  });
  Object.keys(STATE.cashboxes).forEach(id=>{ if(!STATE.cashLedger[id]) STATE.cashLedger[id] = { opening:{}, entries:[] }; });
  if(!Array.isArray(STATE.requests)) { STATE.requests = []; migrated = true; }
  if(!Array.isArray(STATE.journal)) { STATE.journal = []; migrated = true; }
  if(typeof STATE.trCounter !== 'number') { STATE.trCounter = 0; migrated = true; }
  if(!STATE.businessDay || !STATE.businessDay.date) { STATE.businessDay = { date: todayStr(), closed:false }; migrated = true; }
  return migrated;
}

async function loadState(){
  try{
    const res = await fetch('/api/state', { headers: { 'X-Session-Token': SESSION_TOKEN || '' } });
    if(res.status===401){ handleSessionExpired(); return; }
    const data = await res.json();
    if(data && data.value){
      const wasMigrated = normalizeState(data.value);
      if(wasMigrated) await saveState();
      return;
    }
  }catch(e){ console.error(e); }
  STATE = defaultState();
  await saveState();
}
async function saveState(){
  try{
    const res = await fetch('/api/state', { method:'POST', headers:{'Content-Type':'application/json','X-Session-Token':SESSION_TOKEN || ''}, body: JSON.stringify(STATE) });
    if(res.status===401){ handleSessionExpired(); return; }
    if(!res.ok) throw new Error('save_failed');
  }catch(e){ console.error(e); showToast('Хатои пайвастшавӣ бо сервер! / Ошибка соединения с сервером!'); }
}
// Called when the server says our session token is missing/expired.
// Drops back to the login screen without losing unsaved-state confusion —
// the person just logs in again to resume.
function handleSessionExpired(){
  if(pollTimer){ clearInterval(pollTimer); pollTimer = null; }
  SESSION_TOKEN = null;
  CURRENT_USER = null;
  const appScreen = document.getElementById('app-screen');
  const loginScreen = document.getElementById('login-screen');
  if(appScreen && appScreen.style.display!=='none'){
    appScreen.style.display='none';
    loginScreen.style.display='flex';
    showToast('Мӯҳлати сессия гузашт, лутфан аз нав ворид шавед. / Сессия истекла, войдите снова.');
  }
}

// Poll the server every few seconds so changes made on other computers appear here too.
// Skipped while the person is mid-edit locally, so it never overwrites unsaved input.
let pollTimer = null;
function isMidEdit(){
  return mahzanEditMode || kassaEditMode || !!editingReqId || !!editingCbId || openingEditMode || !!ledgerDraft || !!reqDraft || !!editingLedgerNet;
}
function startPolling(){
  if(pollTimer) return;
  pollTimer = setInterval(async ()=>{
    if(!CURRENT_USER || isMidEdit()) return;
    try{
      const res = await fetch('/api/state', { headers: { 'X-Session-Token': SESSION_TOKEN || '' } });
      if(res.status===401){ handleSessionExpired(); return; }
      const data = await res.json();
      if(data && data.value){ normalizeState(data.value); render(); }
    }catch(e){ /* offline — try again next tick */ }
  }, 8000);
}

/* ================= AUTH ================= */
function userDisplayName(key,u){ return (DEFAULT_USER_NAMES[key] && DEFAULT_USER_NAMES[key][LANG]) || u.name; }

// A cashbox lock older than this is treated as abandoned (e.g. the
// previous cashier's browser/tab closed without a clean logout) and can
// be claimed by the next person who logs in — otherwise a forgotten
// logout would permanently strand a cashbox until an admin steps in.
const CASHBOX_LOCK_STALE_MS = 14 * 60 * 60 * 1000; // 14 hours

async function handleLogin(){
  const key = document.getElementById('loginUser').value;
  const pass = document.getElementById('loginPass').value;
  const errEl = document.getElementById('loginErr');
  errEl.style.display='none';
  let data;
  try{
    const res = await fetch('/api/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ username:key, password:pass }) });
    if(!res.ok){ errEl.style.display='block'; errEl.textContent = t('login_err'); return; }
    data = await res.json();
  }catch(e){
    errEl.style.display='block'; errEl.textContent = t('login_err');
    return;
  }
  SESSION_TOKEN = data.token;
  CURRENT_USER = data.user;
  await loadState();

  if(CURRENT_USER.role==='kassir' && CURRENT_USER.cashbox){
    const cb = CURRENT_USER.cashbox;
    const lock = STATE.cashboxLocks[cb];
    const isStale = lock && (Date.now() - (lock.since||0) > CASHBOX_LOCK_STALE_MS);
    if(lock && lock.by !== CURRENT_USER.key && !isStale){
      // Someone else is actively in this cashbox — refuse entry and drop
      // the session token we were just issued.
      fetch('/api/logout', { method:'POST', headers:{'X-Session-Token':SESSION_TOKEN} }).catch(()=>{});
      SESSION_TOKEN = null; CURRENT_USER = null;
      errEl.style.display='block';
      errEl.textContent = LANG==='tj'
        ? `Ин касса ҳозир аз ҷониби ${lock.name} истифода шуда истодааст. Лутфан интизор шавед, то ӯ бароварда шавад, ё бо мудир/администратор тамос гиред.`
        : `Эта касса сейчас занята пользователем ${lock.name}. Дождитесь, пока он выйдет, или обратитесь к заведующему/администратору.`;
      return;
    }
    STATE.cashboxLocks[cb] = { by: CURRENT_USER.key, name: userDisplayName(CURRENT_USER.key, CURRENT_USER), since: Date.now() };
    await saveState();
  }

  document.getElementById('login-screen').style.display='none';
  document.getElementById('app-screen').style.display='block';
  document.getElementById('ubName').textContent = userDisplayName(CURRENT_USER.key, CURRENT_USER);
  document.getElementById('ubRole').textContent = roleLabel(CURRENT_USER.role);
  if(CURRENT_USER.role==='kassir') selectedKassaView = CURRENT_USER.cashbox;
  else selectedKassaView = Object.keys(STATE.cashboxes)[0];
  const landingPage = CURRENT_USER.role==='viewer' ? 'mahzan' : 'dashboard';
  CURRENT_PAGE = landingPage;
  buildNav();
  navigate(landingPage);
  startPolling();
}
async function logout(){
  if(CURRENT_USER && CURRENT_USER.role==='kassir' && CURRENT_USER.cashbox){
    const cb = CURRENT_USER.cashbox;
    const lock = STATE.cashboxLocks[cb];
    if(lock && lock.by===CURRENT_USER.key){
      delete STATE.cashboxLocks[cb];
      await saveState();
    }
  }
  if(SESSION_TOKEN){
    fetch('/api/logout', { method:'POST', headers:{'X-Session-Token':SESSION_TOKEN} }).catch(()=>{});
  }
  SESSION_TOKEN = null;
  CURRENT_USER = null;
  if(pollTimer){ clearInterval(pollTimer); pollTimer = null; }
  document.getElementById('loginPass').value='';
  document.getElementById('app-screen').style.display='none';
  document.getElementById('login-screen').style.display='flex';
}

function ledgerNetBalance(loc, cur){
  if(loc==='mahzan' || !STATE.cashboxes[loc] || !LEDGER_CURRENCIES.includes(cur)) return 0;
  const l = STATE.cashLedger[loc];
  if(!l) return 0;
  const inc = l.entries.filter(e=>e.type==='income').reduce((s,e)=> s+(e.amounts[cur]||0), 0);
  const exp = l.entries.filter(e=>e.type==='expense').reduce((s,e)=> s+(e.amounts[cur]||0), 0);
  return inc - exp;
}
function sumBalance(loc, cur){
  let denomSum = 0;
  if(STATE.balances[loc] && STATE.balances[loc][cur]){
    denomSum = Object.entries(STATE.balances[loc][cur]).reduce((s,[d,c])=> s + (parseFloat(d)*c), 0);
  }
  return round2(denomSum + ledgerNetBalance(loc, cur));
}
// Rounds to 2 decimals and clears the floating-point noise JS arithmetic
// leaves behind (e.g. 1234.30 - 1234.30 sometimes landing on
// 0.00000000002 instead of exactly 0). Used anywhere we compare a computed
// amount to zero, so "actual matches system" is recognized correctly.
function round2(n){ return Math.round(((Number(n)||0) + Number.EPSILON) * 100) / 100; }
function fmt(n){ return n.toLocaleString('ru-RU',{minimumFractionDigits:(n%1!==0?2:0), maximumFractionDigits:2}); }
function fmtMoney(n, cur){ return fmt(n) + ' ' + (CURRENCIES[cur]?CURRENCIES[cur].symbol:cur); }
function showToast(msg){ const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),2800); }
function nextTrNumber(){ STATE.trCounter += 1; const y=new Date().getFullYear(); return 'TR-'+y+'-'+String(STATE.trCounter).padStart(6,'0'); }
function nowTs(){ const d=new Date(); return d.toLocaleDateString('tg-TJ')+' '+d.toLocaleTimeString('tg-TJ',{hour:'2-digit',minute:'2-digit'}); }
function canEditBalances(){ return CURRENT_USER.role==='admin' || CURRENT_USER.role==='mudir'; }

async function saveWorkbook(wb, filename){
  const buf = await wb.xlsx.writeBuffer();
  const blob = new Blob([buf], {type:'application/octet-stream'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

const OFFICIAL_ACCOUNTS = { TJS:'10101972400000000001', USD:'10105840800000000001', EUR:'10105978400000000001', RUB:'10105810500000000001' };
const OFFICIAL_CUR_ORDER = ['TJS','USD','EUR','RUB'];
const OFFICIAL_FONT = 'Palatino Linotype';

function officialCurCodes(cur){ return cur==='TJS' ? ['TJS','TJSF'] : [cur]; }
function computeMahzanOfficialData(day){
  const data = {};
  OFFICIAL_CUR_ORDER.forEach(cur=>{
    const codes = officialCurCodes(cur);
    const expenseOps = STATE.journal.filter(j=> j.type==='transfer' && j.kind!=='item' && codes.includes(j.currency) && j.direction==='from_mahzan' && j.day===day);
    const incomeOps = STATE.journal.filter(j=> j.type==='transfer' && j.kind!=='item' && codes.includes(j.currency) && j.direction==='to_mahzan' && j.day===day);
    data[cur] = {
      expenseCount: expenseOps.length, expenseAmount: expenseOps.reduce((s,j)=>s+j.total,0),
      incomeCount: incomeOps.length, incomeAmount: incomeOps.reduce((s,j)=>s+j.total,0),
    };
  });
  return data;
}
function computeKassaOfficialData(cashboxId, day){
  const data = {};
  const ledger = ledgerFor(cashboxId);
  OFFICIAL_CUR_ORDER.forEach(cur=>{
    const codes = officialCurCodes(cur);
    const fromMahzanOps = STATE.journal.filter(j=> j.type==='transfer' && j.kind!=='item' && j.cashbox===cashboxId && codes.includes(j.currency) && j.direction==='from_mahzan' && j.day===day);
    const toMahzanOps = STATE.journal.filter(j=> j.type==='transfer' && j.kind!=='item' && j.cashbox===cashboxId && codes.includes(j.currency) && j.direction==='to_mahzan' && j.day===day);
    const incomeEntries = ledger.entries.filter(e=> e.type==='income' && e.day===day && codes.some(c=>(e.amounts[c]||0)>0));
    const expenseEntries = ledger.entries.filter(e=> e.type==='expense' && e.day===day && codes.some(c=>(e.amounts[c]||0)>0));
    const sumAmounts = (entries)=> entries.reduce((s,e)=> s + codes.reduce((s2,c)=> s2+(e.amounts[c]||0), 0), 0);
    data[cur] = {
      incomeCount: fromMahzanOps.length + incomeEntries.length,
      incomeAmount: fromMahzanOps.reduce((s,j)=>s+j.total,0) + sumAmounts(incomeEntries),
      expenseCount: toMahzanOps.length + expenseEntries.length,
      expenseAmount: toMahzanOps.reduce((s,j)=>s+j.total,0) + sumAmounts(expenseEntries),
    };
  });
  return data;
}

/* ------------ DAILY CASHIER REPORT (per Instruction No.227, Ch.15) ------------ */
function computeCashierDailyReport(cashboxId, day){
  const report = {};
  Object.keys(CURRENCIES).forEach(cur=>{
    const closing = sumBalance(cashboxId, cur);
    const fromMahzan = STATE.journal.filter(j=> j.type==='transfer' && j.kind!=='item' && j.cashbox===cashboxId && j.currency===cur && j.direction==='from_mahzan' && j.day===day)
      .reduce((s,j)=> s+j.total, 0);
    const toMahzan = STATE.journal.filter(j=> j.type==='transfer' && j.kind!=='item' && j.cashbox===cashboxId && j.currency===cur && j.direction==='to_mahzan' && j.day===day)
      .reduce((s,j)=> s+j.total, 0);
    const ledger = ledgerFor(cashboxId);
    const income = ledger.entries.filter(e=> e.type==='income' && e.day===day).reduce((s,e)=> s+(e.amounts[cur]||0), 0);
    const expense = ledger.entries.filter(e=> e.type==='expense' && e.day===day).reduce((s,e)=> s+(e.amounts[cur]||0), 0);
    const netToday = round2(fromMahzan - toMahzan + income - expense);
    const opening = round2(closing - netToday);
    if(opening===0 && closing===0 && fromMahzan===0 && toMahzan===0 && income===0 && expense===0) return;
    report[cur] = { opening, fromMahzan, toMahzan, income, expense, closing };
  });
  return report;
}
function renderDailyCashierReport(el, cashboxId){
  const day = STATE.businessDay.date;

  const canVerify = CURRENT_USER.role==='admin' || CURRENT_USER.role==='mudir';

      <td class="right num" style="color:${diff===0?'var(--green)':(diff>0?'var(--green)':'var(--red)')};font-weight:600;">${diff===null?'—':fmt(diff)}</td>
    </tr>`;
  }).join('');
  el.insertAdjacentHTML('beforeend', `
    <div class="panel">
      <div class="panel-head"><h3>${t('daily_report_title')} — ${cashboxLabel(cashboxId)}</h3>
        <div class="actions"><span class="muted mono">${day}</span>
        <button class="btn ghost small" id="exportDailyReportBtn">${t('export_excel')}</button></div></div>
      ${Object.keys(report).length ? `<table><thead><tr>
          <th>${t('th_currency')}</th><th class="right">${t('th_opening')}</th><th class="right">${t('daily_received_th')}</th>
          <th class="right">${t('daily_given_th')}</th><th class="right">${t('daily_system_closing_th')}</th>
          <th>${t('daily_actual_th')}</th><th class="right">${t('daily_diff_th')}</th>
        </tr></thead><tbody>${rows}</tbody></table>` : `<div class="empty">${t('no_entries')}</div>`}
      ${canVerify ? `<div style="margin-top:14px;display:flex;gap:10px;">
          <button class="btn" id="saveActualsBtn">${t('save_actuals_btn')}</button>
          <button class="btn ghost" id="genActBtn">${t('gen_act_btn')}</button>
        </div>
        <p class="muted" style="font-size:12px;margin-top:8px;">${t('daily_actual_hint')}</p>` : ''}
    </div>
  `);
  if(canVerify){
    document.querySelectorAll('.daily-actual-input').forEach(inp=>{
      inp.oninput = ()=>{ dailyReportActuals[inp.dataset.cur] = inp.value; };
    });
    document.getElementById('saveActualsBtn').onclick = ()=>{ render(); showToast(t('toast_reconciliation_saved')); };
    document.getElementById('genActBtn').onclick = ()=> exportShortageSurplusAct(cashboxId, day, report);
  }
  document.getElementById('exportDailyReportBtn').onclick = ()=> exportDailyCashierReport(cashboxId, day, report);
}
async function exportDailyCashierReport(cashboxId, day, report){
  if(typeof ExcelJS==='undefined'){ showToast('Excel module not loaded'); return; }
  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet(t('daily_report_title').slice(0,28));
  ws.getColumn(1).width=16; ws.getColumn(2).width=13; ws.getColumn(3).width=13; ws.getColumn(4).width=13; ws.getColumn(5).width=15; ws.getColumn(6).width=15;

  ws.mergeCells(1,1,1,6);
  const brand = ws.getCell(1,1); brand.value='ВАСЛ БОНК'; brand.font={bold:true,size:14,color:{argb:'FF1F4E79'}}; brand.alignment={horizontal:'center'};
  ws.mergeCells(2,1,2,6);
  const title = ws.getCell(2,1); title.value=t('daily_report_title')+' — '+cashboxLabel(cashboxId); title.font={bold:true,size:13}; title.alignment={horizontal:'center'};
  ws.getCell(3,1).value = t('voucher_date_label')+': '+day; ws.getCell(3,1).font={italic:true,size:10,color:{argb:'FF888888'}};

  const headRow = ws.getRow(5);
  [t('th_currency'), t('th_opening'), t('daily_received_th'), t('daily_given_th'), t('daily_system_closing_th'), t('daily_actual_th')].forEach((h,i)=>{
    const c = headRow.getCell(1+i); c.value=h; c.font={bold:true}; c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFF4B183'}};
  });
  let r = 6;
  Object.entries(report).forEach(([cur,rep])=>{

async function exportShortageSurplusAct(cashboxId, day, report){
  if(typeof ExcelJS==='undefined'){ showToast('Excel module not loaded'); return; }
  const rowsWithDiff = Object.entries(report).map(([cur,rep])=>{
    const actual = dailyReportActuals[cur];
    if(actual===undefined || actual===null || actual==='') return null;
    const diff = round2((parseFloat(actual)||0) - rep.closing);
    if(diff===0) return null;
    return { cur, system:rep.closing, actual:parseFloat(actual), diff };
  }).filter(Boolean);
  if(rowsWithDiff.length===0){ showToast(t('no_discrepancy_msg')); return; }
  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet(t('act_sheet_name').slice(0,28));
  ws.getColumn(1).width=16; ws.getColumn(2).width=16; ws.getColumn(3).width=16; ws.getColumn(4).width=16;
  ws.mergeCells(1,1,1,4);
  const brand = ws.getCell(1,1); brand.value='ВАСЛ БОНК'; brand.font={bold:true,size:14,color:{argb:'FF1F4E79'}}; brand.alignment={horizontal:'center'};
  ws.mergeCells(2,1,2,4);
  const title = ws.getCell(2,1); title.value=t('act_title'); title.font={bold:true,size:13}; title.alignment={horizontal:'center'};
  ws.getCell(3,1).value = t('voucher_date_label')+': '+day+' — '+cashboxLabel(cashboxId); ws.getCell(3,1).font={italic:true,size:10,color:{argb:'FF888888'}};

  const headRow = ws.getRow(5);
  [t('th_currency'), t('daily_system_closing_th'), t('daily_actual_th'), t('act_diff_type_th')].forEach((h,i)=>{
    const c = headRow.getCell(1+i); c.value=h; c.font={bold:true}; c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFF4B183'}};
  });
  let r = 6;
  rowsWithDiff.forEach(row=>{
    const rr = ws.getRow(r);
    rr.getCell(1).value = curLabel(row.cur);
    rr.getCell(2).value = row.system;
    rr.getCell(3).value = row.actual;
    rr.getCell(4).value = row.diff>0 ? t('act_surplus') : t('act_shortage');
    rr.getCell(4).font = {bold:true, color:{argb: row.diff>0?'FF2F7D46':'FFC1443B'}};
    r++;
  });
  for(let rr=5; rr<r; rr++) for(let cc=1; cc<=4; cc++) ws.getCell(rr,cc).border = {top:{style:'thin',color:{argb:'FFBBBBBB'}},left:{style:'thin',color:{argb:'FFBBBBBB'}},bottom:{style:'thin',color:{argb:'FFBBBBBB'}},right:{style:'thin',color:{argb:'FFBBBBBB'}}};

  const sigRow = r+2;
  ws.mergeCells(sigRow,1,sigRow,4);
  ws.getCell(sigRow,1).value = t('voucher_signatures_title'); ws.getCell(sigRow,1).font={bold:true,size:12};
  [t('sig_cashier_role'), t('sig_head'), t('sig_accountant')].forEach((label,i)=>{
    const rIdx = sigRow+1+i;
    ws.getCell(rIdx,1).value = label; ws.getCell(rIdx,1).font={bold:true};
    ws.mergeCells(rIdx,2,rIdx,3);
    ws.getCell(rIdx,2).border = { bottom:{style:'thin',color:{argb:'FF444444'}} };
  });

  STATE.journal.push({ id:'AUD-'+Date.now(), trNumber:null, ts:nowTs(), type:'audit_edit', location:cashboxId,
    note:`Shortage/surplus act generated by ${CURRENT_USER.name}: ${rowsWithDiff.map(x=>`${x.cur} ${x.diff>0?'+':''}${x.diff}`).join(', ')}`,
    by:CURRENT_USER.name, device:navigator.userAgent.slice(0,40) });
  await saveState();
  await saveWorkbook(wb, `Акт_${cashboxId}_${day}.xlsx`);
}

async function deleteLedgerEntry(cashboxId, entryId){
  const ledger = ledgerFor(cashboxId);
  const idx = ledger.entries.findIndex(e=>e.id===entryId);
  if(idx===-1) return;
  const entry = ledger.entries[idx];
  if(!confirm(LANG==='ru' ? 'Удалить эту операцию? Это действие необратимо.' : 'Ин амалиётро нест мекунед? Ин амал бебозгашт аст.')) return;
  const summary = LEDGER_CURRENCIES.filter(c=>entry.amounts[c]).map(c=>`${fmt(entry.amounts[c])} ${c}`).join(', ');
  ledger.entries.splice(idx,1);
  STATE.journal.push({
    id:'AUD-'+Date.now(), trNumber:null, ts:nowTs(), type:'audit_edit', location:cashboxId,
    note:`Ledger entry deleted by ${CURRENT_USER.name} (${entry.type}, ${summary || '—'}, note: ${entry.note||'—'})`,
    by:CURRENT_USER.name, device:navigator.userAgent.slice(0,40)
  });
  if(editingLedgerId===entryId){ editingLedgerId=null; editLedgerDraft=null; }
  await saveState();
  showToast(t('toast_op_edited'));
  render();
}

function renderLedgerTable(entries, type, cashboxId, canManage){

  const totals = {};

    LEDGER_CURRENCIES.forEach(c=>{ if(e.amounts[c]) totals[c]=(totals[c]||0)+e.amounts[c]; });

async function deleteRequest(id){
  const req = STATE.requests.find(r=>r.id===id);
  if(!req) return;
  const msg = LANG==='ru'
    ? 'Удалить эту операцию безвозвратно? Остаток кассы и хранилища будет пересчитан.'
    : 'Ин амалиётро бебозгашт нест мекунед? Бақияи касса ва махзан аз нав ҳисоб карда мешавад.';
  if(!confirm(msg)) return;
  let summary;
  if(req.kind==='item'){
    applyItemTransfer(req.cashbox, req.itemKey, req.direction, req.qty, -1);
    summary = `${STATE.inventoryItems[req.itemKey]?STATE.inventoryItems[req.itemKey].label:req.itemKey} × ${req.qty}`;
  } else {
    applyTransfer(req.cashbox, req.currency, req.direction, req.items, -1);
    summary = req.items.filter(i=>i.count>0).map(i=>`${i.count}×${fmt(parseFloat(i.denom))}`).join(', ');
  }
  STATE.requests = STATE.requests.filter(r=>r.id!==id);
  STATE.journal = STATE.journal.filter(j=>j.reqId!==id);
  STATE.journal.push({
    id:'AUD-'+Date.now(), trNumber:null, ts:nowTs(), type:'audit_edit', location:req.cashbox,
    note:`Operation ${req.trNumber||req.id} deleted by ${CURRENT_USER.name} (${req.kind==='item'?t('req_kind_item'):curLabel(req.currency)}, ${summary || '—'})`,
    by:CURRENT_USER.name, device:navigator.userAgent.slice(0,40)
  });
  if(editingReqId===id){ editingReqId=null; editReqDraft=null; }
  await saveState();
  showToast(t('toast_op_edited'));
  render();
}

// Returns null if `loc` has at least as many of every requested denomination
// as `items` asks for, otherwise returns a human-readable error naming the
// first denomination that's short. Prevents a transfer from ever pushing a
// denomination balance below zero (which used to silently happen — a
// return that matched the displayed total but not the actual bills on hand
// would drive individual denominations negative instead of landing on 0).
function checkSufficientDenoms(loc, currency, items){
  for(const it of items){
    const d = it.denom, requested = it.count;
    const have = (STATE.balances[loc] && STATE.balances[loc][currency] && STATE.balances[loc][currency][d]) || 0;
    if(requested > have){
      const place = loc==='mahzan' ? t('mahzan_title') : cashboxLabel(loc);
      return LANG==='tj'
        ? `Дар ${place} барои ${curLabel(currency)} танҳо ${have} дона купюраи ${fmt(d)} мавҷуд аст, вале ${requested} дона дархост шуд.`
        : `В ${place} для ${curLabel(currency)} есть только ${have} купюр(ы) номиналом ${fmt(d)}, а запрошено ${requested}.`;
    }
  }
  return null;
}
// For returns FROM a kassa TO the vault: cash mixes with customer
// transactions all day, so the kassa side is only tracked as a running
// total — a cashier can return whatever real bills they're holding, as
// long as the total value doesn't exceed what the kassa is owed overall.
// (The vault side stays strictly denomination-by-denomination — see
// checkSufficientDenoms — because that balance must be exact for
// regulatory reporting.)
function checkSufficientTotal(loc, currency, items){
  const requestedTotal = items.reduce((s,it)=> s + parseFloat(it.denom)*it.count, 0);
  const have = round2(sumBalance(loc, currency));
  if(round2(requestedTotal) - have > 0.005){
    const place = loc==='mahzan' ? t('mahzan_title') : cashboxLabel(loc);
    return LANG==='tj'
      ? `Дар ${place} барои ${curLabel(currency)} ҳамагӣ ${fmtMoney(have,currency)} мавҷуд аст, вале ${fmtMoney(requestedTotal,currency)} дархост шуд.`
      : `В ${place} для ${curLabel(currency)} есть только ${fmtMoney(have,currency)}, а запрошено ${fmtMoney(requestedTotal,currency)}.`;
  }
  return null;
}
async function submitRequest(){
  const direction = reqDraft.direction;
  const loc = CURRENT_USER.role==='kassir' ? CURRENT_USER.cashbox : reqTargetCashbox;
  const batches = [];
  reqDraft.activeCurrencies.forEach(cur=>{
    const items = Object.entries(reqDraft.byCurrency[cur]||{}).filter(([d,c])=>c>0).map(([denom,count])=>({denom,count}));
    if(items.length) batches.push({ currency:cur, items });
  });
  if(batches.length===0){ showToast(t('toast_denom_needed')); return; }
  // Validate every batch against the actual source balance before touching
  // anything — either the whole request goes through, or none of it does.
  // Vault is source → must match exactly, denomination by denomination.
  // Kassa is source (a "return") → only the total matters, since real
  // cash mixes with customer transactions throughout the day.
  const sourceLoc = direction==='from_mahzan' ? 'mahzan' : loc;
  for(const b of batches){
    const err = direction==='from_mahzan'
      ? checkSufficientDenoms(sourceLoc, b.currency, b.items)
      : checkSufficientTotal(sourceLoc, b.currency, b.items);
    if(err){ showToast(err); return; }
  }
  const batchId = 'B-'+Date.now();
  const createdReqs = [];
  batches.forEach(b=>{
    applyTransfer(loc, b.currency, direction, b.items, 1);
    const total = b.items.reduce((s,i)=> s+ parseFloat(i.denom)*i.count, 0);
    const trNumber = nextTrNumber();
    const req = { id:'REQ-'+Date.now()+'-'+b.currency, kind:'currency', cashbox:loc, direction, currency:b.currency, items:b.items, total,
      status:'approved', createdBy:CURRENT_USER.name, createdTs:nowTs(), decidedBy:CURRENT_USER.name, decidedTs:nowTs(), trNumber, batchId };
    STATE.requests.push(req);
    STATE.journal.push({ id:'J-'+Date.now()+'-'+b.currency, trNumber, ts:nowTs(), type:'transfer', cashbox:loc, direction, currency:b.currency, items:b.items, total,
      by:CURRENT_USER.name, device:navigator.userAgent.slice(0,40), day:STATE.businessDay.date, reqId:req.id, batchId });
    createdReqs.push(req);
  });
  await saveState();
  reqDraft = null;
  showToast(t('toast_op_executed'));
  render();
  exportRequestVoucherBatch(createdReqs.map(r=>r.id));
}
async function submitItemRequest(){

  if(qty > have){

    const itemLabel = (STATE.inventoryItems[itemKey]||{}).label || itemKey;
    showToast(LANG==='tj'
      ? `Дар ${place} барои «${itemLabel}» танҳо ${have} дона мавҷуд аст, вале ${qty} дона дархост шуд.`
      : `В ${place} для «${itemLabel}» есть только ${have} шт., а запрошено ${qty}.`);
    return;
  }
  applyItemTransfer(loc, itemKey, direction, qty, 1);
  const trNumber = nextTrNumber();
  const req = { id:'REQ-'+Date.now(), kind:'item', cashbox:loc, direction, itemKey, qty, total:qty, status:'approved',
    createdBy:CURRENT_USER.name, createdTs:nowTs(), decidedBy:CURRENT_USER.name, decidedTs:nowTs(), trNumber };

    by:CURRENT_USER.name, device:navigator.userAgent.slice(0,40), day:STATE.businessDay.date, reqId:req.id });
  await saveState();
  reqDraft = null;
  showToast(t('toast_op_executed'));
  render();
}
function applyItemTransfer(loc, itemKey, direction, qty, sign){
  const q = qty*sign;
  if(!STATE.inventoryBalances[loc]) STATE.inventoryBalances[loc] = {};
  if(!STATE.inventoryBalances['mahzan']) STATE.inventoryBalances['mahzan'] = {};
  if(direction==='from_mahzan'){
    STATE.inventoryBalances['mahzan'][itemKey] = (STATE.inventoryBalances['mahzan'][itemKey]||0) - q;
    STATE.inventoryBalances[loc][itemKey] = (STATE.inventoryBalances[loc][itemKey]||0) + q;
  } else {
    STATE.inventoryBalances[loc][itemKey] = (STATE.inventoryBalances[loc][itemKey]||0) - q;
    STATE.inventoryBalances['mahzan'][itemKey] = (STATE.inventoryBalances['mahzan'][itemKey]||0) + q;
  }
}
function applyTransfer(loc, currency, direction, items, sign){
  for(const it of items){
    const d = it.denom, c = it.count * sign;
    if(direction==='from_mahzan'){
      STATE.balances['mahzan'][currency][d] = (STATE.balances['mahzan'][currency][d]||0) - c;
      STATE.balances[loc][currency][d] = (STATE.balances[loc][currency][d]||0) + c;
    } else {
      STATE.balances[loc][currency][d] = (STATE.balances[loc][currency][d]||0) - c;
      STATE.balances['mahzan'][currency][d] = (STATE.balances['mahzan'][currency][d]||0) + c;
    }
  }
}

async function saveEditedRequest(req){
  const items = Object.entries(editReqDraft).filter(([d,c])=>c>0).map(([denom,count])=>({denom,count}));
  if(items.length===0){ showToast(t('toast_denom_needed')); return; }
  const newTotal = items.reduce((s,i)=> s + parseFloat(i.denom)*i.count, 0);
  const oldSummary = req.items.filter(i=>i.count>0).map(i=> `${i.count}×${fmt(parseFloat(i.denom))}`).join(', ');
  const newSummary = items.map(i=> `${i.count}×${fmt(parseFloat(i.denom))}`).join(', ');
  const sourceLoc = req.direction==='from_mahzan' ? 'mahzan' : req.cashbox;
  applyTransfer(req.cashbox, req.currency, req.direction, req.items, -1);
  const err = req.direction==='from_mahzan'
    ? checkSufficientDenoms(sourceLoc, req.currency, items)
    : checkSufficientTotal(sourceLoc, req.currency, items);
  if(err){
    applyTransfer(req.cashbox, req.currency, req.direction, req.items, 1); // restore, nothing actually changes
    showToast(err);
    return;
  }
  applyTransfer(req.cashbox, req.currency, req.direction, items, 1);
  req.items = items; req.total = newTotal; req.editedBy = CURRENT_USER.name; req.editedTs = nowTs();
  const j = STATE.journal.find(j=> j.reqId===req.id);
  if(j){ j.items = items; j.total = newTotal; j.editedBy = CURRENT_USER.name; }
  STATE.journal.push({ id:'AUD-'+Date.now(), trNumber:null, ts:nowTs(), type:'audit_edit', location:req.cashbox,
    note:`Correction of ${req.trNumber||req.id} by ${CURRENT_USER.name}: "${oldSummary}" -> "${newSummary}"`,
    by:CURRENT_USER.name, device:navigator.userAgent.slice(0,40) });
  await saveState();
  editingReqId = null; editReqDraft = null;
  showToast(t('toast_op_edited'));
  render();
}

function computeDenomBreakdown(){
  const today = STATE.businessDay.date;
  const filtered = STATE.journal.filter(j=> j.type==='transfer' && j.day===today && (reportCashboxFilter==='all' || j.cashbox===reportCashboxFilter));
  const out = {};
  Object.keys(CURRENCIES).forEach(cur=>{
    const received = {}, given = {};
    filtered.filter(j=>j.currency===cur).forEach(j=>{
      const target = j.direction==='from_mahzan' ? received : given;
      j.items.forEach(it=> target[it.denom] = (target[it.denom]||0) + it.count);
    });
    out[cur] = {received, given};
  });
  return out;
}
function renderDenomBreakdown(){
  const body = document.getElementById('denomBreakdownBody');
  if(!body) return;
  const data = computeDenomBreakdown();
  let html = '';
  Object.keys(CURRENCIES).forEach(cur=>{
    const {received, given} = data[cur];
    const denomsUsed = new Set([...Object.keys(received), ...Object.keys(given)]);
    if(denomsUsed.size===0) return;
    const rows = CURRENCIES[cur].denoms.filter(d=> denomsUsed.has(String(d))).map(d=>{
      const r = received[d]||0, g = given[d]||0;
      return `<tr><td class="num">${fmt(d)}</td><td class="right num" style="color:var(--green);">${r||'—'}</td><td class="right num" style="color:var(--red);">${g||'—'}</td></tr>`;
    }).join('');
    html += `<h3 style="font-size:14px;color:var(--brass-bright);margin:16px 0 8px;">${curLabel(cur)}</h3>
      <table><thead><tr><th>${t('th_denom')}</th><th class="right">${t('received_count_th')}</th><th class="right">${t('given_count_th')}</th></tr></thead><tbody>${rows}</tbody></table>`;
  });
  body.innerHTML = html || `<div class="empty">${t('no_ops_filter')}</div>`;
}
function exportDenomBreakdown(){
  const data = computeDenomBreakdown();
  const sheets = {};
  Object.keys(CURRENCIES).forEach(cur=>{
    const {received, given} = data[cur];
    const denomsUsed = new Set([...Object.keys(received), ...Object.keys(given)]);
    if(denomsUsed.size===0) return;
    const rows = CURRENCIES[cur].denoms.filter(d=> denomsUsed.has(String(d))).map(d=>({
      [t('th_denom')]: d, [t('received_count_th')]: received[d]||0, [t('given_count_th')]: given[d]||0
    }));
    sheets[cur] = rows;
  });
  if(Object.keys(sheets).length===0){ showToast(t('no_ops_filter')); return; }
  exportMultiSheetStyled(`Купюрахо_${STATE.businessDay.date}.xlsx`, sheets);
}
function makeStat(label,value){
  const d = document.createElement('div'); d.className='card stat-card';
  d.innerHTML = `<div class="label">${label}</div><div class="value" style="font-size:19px;">${value}</div>`;
  return d;
}

  document.getElementById('addItemBtn').onclick = async ()=>{
    const label = document.getElementById('newItemLabel').value.trim();
    if(!label){ showToast(t('toast_cb_needed')); return; }
    const key = 'item_' + Date.now().toString(36);
    STATE.inventoryItems[key] = { label };
    Object.keys(STATE.inventoryBalances).forEach(loc=> STATE.inventoryBalances[loc][key]=0);
    await saveState();
    showToast(t('toast_cb_added'));
    render();
  };
}

function renameCashbox(oldId, newId, newLabel){
  if(newId === oldId){
    STATE.cashboxes[oldId].label = newLabel;
    return;
  }
  STATE.cashboxes[newId] = { label:newLabel };
  STATE.balances[newId] = STATE.balances[oldId];
  STATE.cashLedger[newId] = STATE.cashLedger[oldId];
  STATE.inventoryBalances[newId] = STATE.inventoryBalances[oldId];
  STATE.cashboxAccounts[newId] = STATE.cashboxAccounts[oldId] || {TJS:'',USD:'',EUR:'',RUB:''};
  delete STATE.cashboxes[oldId]; delete STATE.balances[oldId]; delete STATE.cashLedger[oldId]; delete STATE.inventoryBalances[oldId]; delete STATE.cashboxAccounts[oldId];

  // move the associated kassir user to the new key so login stays in sync
  const userEntry = Object.entries(STATE.users).find(([,u])=> u.cashbox===oldId);
  if(userEntry){
    const [oldUserKey, u] = userEntry;
    u.cashbox = newId;
    if(oldUserKey === oldId){
      STATE.users[newId] = u;
      delete STATE.users[oldUserKey];
    }
  }
  // re-point historical records so nothing gets orphaned
  STATE.requests.forEach(r=>{ if(r.cashbox===oldId) r.cashbox = newId; });
  STATE.journal.forEach(j=>{ if(j.cashbox===oldId) j.cashbox = newId; if(j.location===oldId) j.location = newId; });
  if(selectedKassaView===oldId) selectedKassaView = newId;
  if(CURRENT_USER && CURRENT_USER.cashbox===oldId) CURRENT_USER.cashbox = newId;
}

}
